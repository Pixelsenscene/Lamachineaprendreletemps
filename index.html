<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Machine à Prendre le Temps</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Transition d'opacité pour le fondu au noir (200ms) */
        #hero-video {
            transition: opacity 0.2s ease-in-out;
            opacity: 1;
        }
    </style>
</head>

<body class="home-mode">

    <!-- Section Vidéo d'Accueil (cliquable pour changer de vidéo) -->
    <section id="hero-section" class="video-loaded" style="cursor: pointer;" onclick="switchHeroVideo()"
        title="Cliquez pour changer de vidéo">
        <div class="video-container">
            <video id="hero-video" autoplay muted playsinline preload="auto" disablePictureInPicture
                controlsList="nodownload noremoteplayback" loop>
                <source id="hero-source"
                    src="https://MaptDiff.b-cdn.net/Montages%20compil%C3%A9s/LeFilduTemps%20-%20Hiver1-SiteWeb%20MPEG-4.mp4"
                    type="video/mp4">
                Votre navigateur ne prend pas en charge la lecture de vidéos.
            </video>
        </div>
        <h1 class="hero-title">La Machine à Prendre le Temps</h1>
    </section>

    <!-- Bandeau du Menu Principal avec sous-menus -->
    <header id="main-header">
        <nav>
            <ul class="main-menu">
                <li><a href="#" data-page="accueil" class="active">Accueil</a></li>

                <!-- Menu Galeries avec sous-menus en minuscules -->
                <li class="has-submenu">
                    <a href="#" data-page="galerie-courtes-realisations">Galeries</a>
                    <ul class="submenu">
                        <li><a href="#" data-page="galerie-courtes-realisations">Courtes réalisations</a></li>
                        <li><a href="#" data-page="galerie-par-thematiques">Par thématiques</a></li>
                        <li><a href="#" data-page="galerie-premieres-machines">Les 1ères Machines</a></li>
                        <li><a href="#" data-page="galerie-ralentis">Ralentis</a></li>
                    </ul>
                </li>

                <!-- Menu Evènements avec sous-menus -->
                <li class="has-submenu">
                    <a href="#" data-page="evenements-actualite">Evènements</a>
                    <ul class="submenu">
                        <li><a href="#" data-page="evenements-passe">Passé</a></li>
                        <li><a href="#" data-page="evenements-actualite">Actualité</a></li>
                        <li><a href="#" data-page="evenements-avenir">À venir</a></li>
                    </ul>
                </li>

                <li><a href="#" data-page="dossiers">Dossiers</a></li>
                <li><a href="#" data-page="contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteneur Principal Dynamique -->
    <main id="main-container">
        <div id="page-content" class="page-content active"></div>
    </main>

    <!-- Script de gestion centralisé -->
    <script>
        // ==========================================
        // CONFIGURATION CENTRALE DES VIDÉOS D'ACCUEIL
        // ==========================================
        const CONFIG = {
            transitionDuration: 200, // Durée du fondu au noir en millisecondes (200ms)
            videos: [
                {
                    src: "https://MaptDiff.b-cdn.net/Montages%20compil%C3%A9s/LeFilduTemps%20-%20Hiver1-SiteWeb%20MPEG-4.mp4",
                    customLoop: true,
                    startTime: 16,
                    endTime: 106
                },
                {
                    src: "https://MaptDiff.b-cdn.net/Vid%C3%A9os%20Format%20Insta%20Verti/phare%20StMathieu1%20PL%20web-SiteWeb%20MPEG-4.mp4",
                    customLoop: false
                },
                {
                    src: "https://MaptDiff.b-cdn.net/Vid%C3%A9os%20Format%20Insta%20Verti/Envole%CC%81e%20dansante-SiteWeb%20MPEG-4.mp4",
                    customLoop: false
                },
                {
                    src: "https://MaptDiff.b-cdn.net/RALENTIS%20VR%20paysage/Baie%20Mont%20Saint%20Michel%20-%20VR-SiteWeb%20MPEG-4.mp4",
                    customLoop: false
                }
            ]
        };

        let currentHeroIndex = 0;
        let isTransitioning = false;

        // Fonction centralisée corrigée pour forcer le retour à 0 net
        function loadAndPlayVideo(videoEl, sourceEl, videoData, callback) {
            sourceEl.src = videoData.src;
            videoEl.load();

            // Forçage immédiat du currentTime à 0 ou startTime
            videoEl.currentTime = videoData.customLoop ? videoData.startTime : 0;

            const handleReady = () => {
                videoEl.currentTime = videoData.customLoop ? videoData.startTime : 0;
                videoEl.play().then(() => {
                    setTimeout(() => {
                        videoEl.style.opacity = '1';
                        if (typeof callback === 'function') callback();
                    }, 50);
                }).catch(error => {
                    console.log("Lecture automatique bloquée : ", error);
                    if (typeof callback === 'function') callback();
                });
            };

            videoEl.addEventListener('canplay', handleReady, { once: true });
        }

        // Fonction déclenchée au clic pour changer de vidéo d'accueil
        function switchHeroVideo() {
            if (isTransitioning) return;
            isTransitioning = true;

            const heroVideo = document.getElementById('hero-video');
            const heroSource = document.getElementById('hero-source');

            // 1. Fondu au noir
            heroVideo.style.opacity = '0';

            // 2. Changement après 200ms
            setTimeout(() => {
                currentHeroIndex = (currentHeroIndex + 1) % CONFIG.videos.length;
                const nextData = CONFIG.videos[currentHeroIndex];

                loadAndPlayVideo(heroVideo, heroSource, nextData, () => {
                    setTimeout(() => {
                        isTransitioning = false;
                    }, CONFIG.transitionDuration);
                });
            }, CONFIG.transitionDuration);
        }

        // ==========================================
        // GESTION GLOBALE DE L'INTERACTIVITÉ DES BLOCS (Photo/Vidéo & Clic texte)
        // ==========================================
        function handleMediaClick(container) {
            const videoUrl = container.getAttribute('data-video');
            const imgSrc = container.getAttribute('data-img');
            const imgAlt = container.getAttribute('data-alt');
            const isVideo = container.querySelector('video');

            if (!isVideo) {
                const isTchin = videoUrl.includes('TchinTchin');
                container.innerHTML = `
                    <video autoplay muted playsinline disablePictureInPicture controlsList="nodownload noremoteplayback nofullscreen" ${isTchin ? '' : 'loop'}>
                        <source src="${videoUrl}" type="video/mp4">
                        Votre navigateur ne prend pas en charge la lecture de vidéos.
                    </video>
                `;
                const vid = container.querySelector('video');
                vid.currentTime = 0;

                if (isTchin) {
                    vid.addEventListener('timeupdate', function () {
                        if (this.currentTime >= 29) {
                            this.currentTime = 0;
                        }
                    });
                }
            } else {
                container.innerHTML = `
                    <img src="${imgSrc}" alt="${imgAlt}">
                `;
            }
        }

        // Fonction de centrage vertical sur-mesure pour les blocs d'accueil
        function scrollToBlockCentered(targetBlock) {
            const header = document.getElementById('main-header');
            const headerHeight = header ? header.offsetHeight : 0;

            const rect = targetBlock.getBoundingClientRect();
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const blockTopRelativeToPage = rect.top + scrollTop;

            const availableHeight = window.innerHeight - headerHeight;
            const targetScrollY = blockTopRelativeToPage - headerHeight - (availableHeight - rect.height) / 2;

            window.scrollTo({
                top: Math.max(0, targetScrollY),
                behavior: 'smooth'
            });
        }

        // Écouteur global pour le clic sur le texte (fonctionne même après chargement dynamique)
        document.addEventListener('click', (e) => {
            const textSide = e.target.closest('.text-side');
            if (!textSide) return;

            const currentBlock = textSide.closest('.content-block');
            const blocks = Array.from(document.querySelectorAll('.content-block'));
            const index = blocks.indexOf(currentBlock);

            if (index === -1) return;

            let targetBlock;
            if (index === blocks.length - 1) {
                targetBlock = blocks[0]; // Bouclage vers le 1er bloc
            } else {
                targetBlock = blocks[index + 1]; // Bloc suivant
            }

            scrollToBlockCentered(targetBlock);
        });

        // Initialisation au chargement de la page
        window.addEventListener('DOMContentLoaded', () => {
            const heroVideo = document.getElementById('hero-video');
            const heroSource = document.getElementById('hero-source');

            if (heroVideo) {
                const initialData = CONFIG.videos[currentHeroIndex];
                heroVideo.style.opacity = '0';

                loadAndPlayVideo(heroVideo, heroSource, initialData);

                heroVideo.addEventListener('timeupdate', function () {
                    const data = CONFIG.videos[currentHeroIndex];
                    if (data.customLoop && this.currentTime >= data.endTime) {
                        this.currentTime = data.startTime;
                    }
                });
            }

            // Gestion du comportement intelligent du menu "Accueil"
            const accueilLink = document.querySelector('a[data-page="accueil"]');
            if (accueilLink) {
                accueilLink.addEventListener('click', (e) => {
                    const scrollY = window.scrollY || window.pageYOffset;
                    if (scrollY < 300) {
                        e.preventDefault();
                        const firstBlock = document.querySelector('.content-block');
                        if (firstBlock) {
                            scrollToBlockCentered(firstBlock);
                        }
                    }
                });
            }
        });
    </script>

    <script src="script.js"></script>
</body>

</html>
