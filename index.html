<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Indique à iOS de masquer la barre de navigation du navigateur -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>La Machine à Prendre le Temps</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import de la police manuscrite pour le titre du bandeau -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
        /* Transition d'opacité pour le fondu au noir (200ms) */
        #hero-video {
            transition: opacity 0.2s ease-in-out;
            opacity: 1;
        }

        #main-header nav {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            gap: 40px;
            /* Ajuste cet espace entre l'élément de gauche et les menus si besoin */
        }

        /* --- TITRE MANUSCRIT (À gauche, décalé vers la droite) --- */
        .header-brand-title {
            display: none;
            font-family: 'Caveat', cursive, sans-serif;
            font-size: 1.8rem;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
            transition: opacity 0.2s ease;
            margin-left: 40px;
            /* Décale le titre manuscrit vers la droite */
        }

        .header-brand-title:hover {
            opacity: 0.75;
        }

        /* --- SYMBOLE ORIENTÉ VERS LE BAS (Décalé vers la droite) --- */
        .nav-eject-down-container {
            display: inline-block;
            margin-left: 40px;
            /* Décale le symbole vers la droite (même valeur que le titre) */
        }

        .nav-eject-down {
            display: inline-block;
            font-size: 1.4rem;
            text-decoration: none;
            color: #ffffff;
            transform: rotate(180deg);
            transition: transform 0.3s ease, opacity 0.2s ease;
            line-height: 1;
        }

        .nav-eject-down:hover {
            transform: rotate(180deg) translateY(-3px);
            opacity: 0.8;
        }

        /* --- STYLE DES MENUS --- */
        .main-menu {
            display: flex;
            gap: 30px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* En haut de l'accueil : aligné à gauche avec un espacement équilibré */
        #main-header nav {
            justify-content: flex-start;
        }

        /* --- QUAND ON DÉFILE OU QU'ON CHANGE DE PAGE --- */
        body.scrolled-mode .header-brand-title,
        body.page-mode .header-brand-title {
            display: inline-block;
        }

        body.scrolled-mode .nav-eject-down-container,
        body.page-mode .nav-eject-down-container {
            display: none !important;
        }

        /* Quand le titre manuscrit est là, on espace le titre et les menus aux extrémités */
        body.scrolled-mode #main-header nav,
        body.page-mode #main-header nav {
            justify-content: space-between;
        }

        @media (max-width: 900px) {
            #main-header nav {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
                justify-content: center !important;
            }

            .header-brand-title,
            .nav-eject-down-container {
                margin-left: 0 !important;
            }

            .header-brand-title {
                font-size: 1.5rem;
            }

            .main-menu {
                margin: 0 auto !important;
            }
        }
    </style>
</head>

<body class="home-mode">

    <!-- Section Vidéo d'Accueil (cliquable pour changer de vidéo) -->
    <section id="hero-section" class="video-loaded" style="cursor: pointer;" onclick="switchHeroVideo()"
        title="Cliquez pour changer de vidéo">
        <div class="video-container">
            <video id="hero-video" autoplay muted playsinline preload="auto" disablePictureInPicture
                controlsList="nodownload noremoteplayback" loop>
                <source id="hero-source"
                    src="https://MaptDiff.b-cdn.net/Montages%20compil%C3%A9s/LeFilduTemps%20-%20Hiver1-SiteWeb%20MPEG-4.mp4"
                    type="video/mp4">
                Votre navigateur ne prend pas en charge la lecture de vidéos.
            </video>
        </div>
        <h1 class="hero-title">La Machine à Prendre le Temps</h1>
    </section>

    <!-- Bandeau du Menu Principal -->
    <!-- Bandeau du Menu Principal -->
    <header id="main-header">
        <nav>
            <!-- Titre manuscrit à gauche (apparaît quand on descend) -->
            <a href="#" data-page="accueil" class="header-brand-title">La Machine à Prendre le Temps</a>

            <!-- Conteneur du symbole orienté vers le bas (visible uniquement en haut de la vidéo) -->
            <div class="nav-eject-down-container">
                <a href="#" data-action="scroll-down" class="nav-eject-down" title="Descendre vers le contenu">⏏︎</a>
            </div>

            <ul class="main-menu">
                <!-- Menu Galeries avec sous-menus -->
                <li class="has-submenu">
                    <a href="#" data-page="galerie-courtes-realisations">Galeries</a>
                    <ul class="submenu">
                        <li><a href="#" data-page="galerie-courtes-realisations">Courtes réalisations</a></li>
                        <li><a href="#" data-page="galerie-par-thematiques">Par thématiques</a></li>
                        <li><a href="#" data-page="galerie-premieres-machines">Les 1ères Machines</a></li>
                        <li><a href="#" data-page="galerie-ralentis">Ralentis</a></li>
                    </ul>
                </li>

                <!-- Menu Evènements avec sous-menus -->
                <li class="has-submenu">
                    <a href="#" data-page="evenements-actualite">Evènements</a>
                    <ul class="submenu">
                        <li><a href="#" data-page="evenements-passe">Passé</a></li>
                        <li><a href="#" data-page="evenements-actualite">Actualité</a></li>
                        <li><a href="#" data-page="evenements-avenir">À venir</a></li>
                    </ul>
                </li>

                <li><a href="#" data-page="dossiers">Dossiers</a></li>
                <li><a href="#" data-page="contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteneur Principal Dynamique -->
    <main id="main-container">
        <div id="page-content" class="page-content active"></div>
    </main>

    <!-- Script de gestion centralisé (Carrousel, Fondu & Média) -->
    <script>
        // ==========================================
        // CONFIGURATION CENTRALE DES VIDÉOS D'ACCUEIL
        // ==========================================
        const CONFIG = {
            transitionDuration: 200, // Durée du fondu au noir en millisecondes (200ms)
            videos: [
                {
                    src: "https://MaptDiff.b-cdn.net/Montages%20compil%C3%A9s/LeFilduTemps%20-%20Hiver1-SiteWeb%20MPEG-4.mp4",
                    customLoop: true,
                    startTime: 16,
                    endTime: 106
                },
                {
                    src: "https://MaptDiff.b-cdn.net/Vid%C3%A9os%20Format%20Insta%20Verti/phare%20StMathieu1%20PL%20web-SiteWeb%20MPEG-4.mp4",
                    customLoop: false
                },
                {
                    src: "https://MaptDiff.b-cdn.net/Vid%C3%A9os%20Format%20Insta%20Verti/Envole%CC%81e%20dansante-SiteWeb%20MPEG-4.mp4",
                    customLoop: false
                },
                {
                    src: "https://MaptDiff.b-cdn.net/RALENTIS%20VR%20paysage/Baie%20Mont%20Saint%20Michel%20-%20VR-SiteWeb%20MPEG-4.mp4",
                    customLoop: false
                }
            ]
        };

        let currentHeroIndex = 0;
        let isTransitioning = false;

        // Fonction centralisée pour charger et lancer la vidéo d'accueil
        function loadAndPlayVideo(videoEl, sourceEl, videoData, callback) {
            sourceEl.src = videoData.src;
            videoEl.load();

            videoEl.currentTime = videoData.customLoop ? videoData.startTime : 0;

            const handleReady = () => {
                videoEl.currentTime = videoData.customLoop ? videoData.startTime : 0;
                videoEl.play().then(() => {
                    setTimeout(() => {
                        videoEl.style.opacity = '1';
                        if (typeof callback === 'function') callback();
                    }, 50);
                }).catch(error => {
                    console.log("Lecture automatique bloquée : ", error);
                    if (typeof callback === 'function') callback();
                });
            };

            videoEl.addEventListener('canplay', handleReady, { once: true });
        }

        // Fonction déclenchée au clic pour changer de vidéo d'accueil
        function switchHeroVideo() {
            if (isTransitioning) return;
            isTransitioning = true;

            const heroVideo = document.getElementById('hero-video');
            const heroSource = document.getElementById('hero-source');

            // 1. Fondu au noir
            heroVideo.style.opacity = '0';

            // 2. Changement après 200ms
            setTimeout(() => {
                currentHeroIndex = (currentHeroIndex + 1) % CONFIG.videos.length;
                const nextData = CONFIG.videos[currentHeroIndex];

                loadAndPlayVideo(heroVideo, heroSource, nextData, () => {
                    setTimeout(() => {
                        isTransitioning = false;
                    }, CONFIG.transitionDuration);
                });
            }, CONFIG.transitionDuration);
        }

        // Initialisation au chargement de la page
        window.addEventListener('DOMContentLoaded', () => {
            const heroVideo = document.getElementById('hero-video');
            const heroSource = document.getElementById('hero-source');

            if (heroVideo) {
                const initialData = CONFIG.videos[currentHeroIndex];
                heroVideo.style.opacity = '0';

                loadAndPlayVideo(heroVideo, heroSource, initialData);

                // Gestion de la boucle spécifique
                heroVideo.addEventListener('timeupdate', function () {
                    const data = CONFIG.videos[currentHeroIndex];
                    if (data.customLoop && this.currentTime >= data.endTime) {
                        this.currentTime = data.startTime;
                    }
                });
            }
        });
    </script>

    <script src="script.js"></script>
</body>

</html>
