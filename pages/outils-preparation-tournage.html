<!-- === 1. LE CONTENU === -->
<!-- Outil repris de l'appli Python "AppliRalentir" (page "Machine à Prendre le Temps") -->
<section class="tool-prepa" id="tool-prepa" data-mode="none">

    <h2 id="pt-machineTitle" class="pageTitle" role="button" tabindex="0" title="Cliquer pour tout réinitialiser">
        La Machine<br>
        à prendre le Temps
    </h2>

    <div id="mptPage">

        <!-- Zone Tournage -->
        <div class="bloc" id="pt-blocTournage">
            <h2 class="titreBloc">Tournage</h2>

            <div class="ligneChamps">
                <div class="champAvecUnite">
                    <input type="number" id="pt-t_h" placeholder="heures" min="0" step="any">
                    <span class="unit" id="pt-t_h_unit"></span>
                </div>
                <div class="champAvecUnite">
                    <input type="number" id="pt-t_m" placeholder="minutes" min="0" step="any">
                    <span class="unit" id="pt-t_m_unit"></span>
                </div>
                <div class="champAvecUnite">
                    <input type="number" id="pt-t_s" placeholder="secondes" min="0" step="any">
                    <span class="unit" id="pt-t_s_unit"></span>
                </div>
            </div>

            <div class="blinkCalc" id="pt-blink-t" role="button" tabindex="0" hidden>CALCULER</div>
            <div class="sousTexte" id="pt-t_seconds">(0 seconde)</div>
        </div>

        <!-- Zone Vitesse avec flèches -->
        <div class="ligneVitesse3cols">

            <!-- Colonne 1 : flèche ↓ = accélération -->
            <div class="colVitesse">
                <div id="pt-flecheGauche" class="fleche" role="button" tabindex="0" aria-label="Accélération">&#8595;
                </div>
            </div>

            <!-- Colonne 2 : bloc Vitesse -->
            <div class="colVitesse">
                <div class="bloc" id="pt-blocVitesse">
                    <h2 class="titreBloc">Vitesse</h2>

                    <div id="pt-v_type">(mode)</div>

                    <div class="vitesseInputRow">
                        <span id="pt-symboleVitesse" class="symboleVitesse">X</span>
                        <input type="number" id="pt-v_val" placeholder="----" min="0" step="any">
                    </div>

                    <div class="blinkCalc" id="pt-blink-v" role="button" tabindex="0" hidden>CALCULER</div>
                </div>
            </div>

            <!-- Colonne 3 : flèche ↑ = ralentissement -->
            <div class="colVitesse">
                <div id="pt-flecheDroite" class="fleche" role="button" tabindex="0" aria-label="Ralentissement">&#8593;
                </div>
            </div>

        </div>

        <!-- Zone Vidéo finale -->
        <div class="bloc" id="pt-blocVideo">
            <h2 class="titreBloc">Vidéo finale</h2>

            <div class="ligneChamps">
                <div class="champAvecUnite">
                    <input type="number" id="pt-vf_h" placeholder="heures" min="0" step="any">
                    <span class="unit" id="pt-vf_h_unit"></span>
                </div>
                <div class="champAvecUnite">
                    <input type="number" id="pt-vf_m" placeholder="minutes" min="0" step="any">
                    <span class="unit" id="pt-vf_m_unit"></span>
                </div>
                <div class="champAvecUnite">
                    <input type="number" id="pt-vf_s" placeholder="secondes" min="0" step="any">
                    <span class="unit" id="pt-vf_s_unit"></span>
                </div>
            </div>

            <div class="blinkCalc" id="pt-blink-vf" role="button" tabindex="0" hidden>CALCULER</div>
            <div class="sousTexte" id="pt-vf_seconds">(0 seconde)</div>
        </div>

    </div>

    <!-- Réinitialisation : remet tous les blocs à zéro -->
    <button type="button" id="pt-btnReset">Réinitialiser</button>
</section>

<!-- === 3. LE SCRIPT (JAVASCRIPT) === -->
<script>
    // Logique de l'appli d'origine, réorganisée autour d'UN SEUL état et d'UNE SEULE fonction
    // d'affichage (render) : plus de couleurs modifiées à plusieurs endroits, plus de variables
    // globales, plus de bouton CALCULER recréé à chaque saisie.
    //
    // Principe : 3 blocs (Tournage "t", Vitesse "v", Vidéo finale "vf"). Quand 2 blocs sont
    // saisis par l'utilisateur, le 3e est calculé :
    //   • Tournage + Vitesse   → Vidéo finale  (accélération : vidéo = tournage ÷ vitesse)
    //   • Vidéo finale + Vitesse → Tournage    (ralentissement : tournage = vidéo × vitesse)
    //   • Tournage + Vidéo finale → Vitesse    (vitesse = tournage ÷ vidéo)
    (function () {
        const root = document.getElementById('tool-prepa');
        if (!root) return;

        const $ = (id) => document.getElementById('pt-' + id);

        const BLOCS = { t: 'blocTournage', v: 'blocVitesse', vf: 'blocVideo' };
        const CHAMPS = { t: ['t_h', 't_m', 't_s'], v: ['v_val'], vf: ['vf_h', 'vf_m', 'vf_s'] };
        const UNITES = [
            ['t_h', 't_h_unit', 'H'], ['t_m', 't_m_unit', 'min'], ['t_s', 't_s_unit', 's'],
            ['vf_h', 'vf_h_unit', 'H'], ['vf_m', 'vf_m_unit', 'min'], ['vf_s', 'vf_s_unit', 's']
        ];

        const state = {
            kind: { t: 'empty', v: 'empty', vf: 'empty' }, // 'empty' | 'input' (saisi) | 'result' (calculé)
            order: [],        // ordre dans lequel les blocs ont été saisis (sert à choisir le mode)
            mode: null,       // 'accel' | 'ralent' | null
            computed: false,  // true juste après un CALCULER (résultat à jour)
            touched: false    // true dès la première saisie
        };

        // ---------- temps ----------
        function secondsOf(block) {
            const [h, m, s] = CHAMPS[block].map(id => Number($(id).value || 0));
            return h * 3600 + m * 60 + s;
        }

        function setTime(block, total) {
            const t = Math.max(0, Math.round(total)); // on arrondit AVANT de découper (plus de "60 s")
            const [h, m, s] = CHAMPS[block];
            $(h).value = Math.floor(t / 3600);
            $(m).value = Math.floor((t % 3600) / 60);
            $(s).value = t % 60;
        }

        // Un bloc de temps est "saisi" s'il représente une durée > 0 (les "0" laissés par un
        // calcul précédent ne comptent pas) ; la vitesse, dès qu'elle n'est pas vide.
        function isFilled(block) {
            if (block === 'v') return $('v_val').value !== '';
            return secondsOf(block) > 0;
        }

        // ---------- logique ----------
        // Le bloc à calculer = celui qui reste quand exactement 2 blocs sont saisis
        function getTarget() {
            const inputs = Object.keys(BLOCS).filter(b => state.kind[b] === 'input');
            if (inputs.length !== 2) return null;
            return Object.keys(BLOCS).find(b => !inputs.includes(b));
        }

        function applyAutoMode() {
            const target = getTarget();
            if (target === 'vf') state.mode = 'accel';
            else if (target === 't') state.mode = 'ralent';
            else if (target === 'v') {
                // Tournage saisi en premier → accélération ; Vidéo finale en premier → ralentissement
                state.mode = state.order.indexOf('t') < state.order.indexOf('vf') ? 'accel' : 'ralent';
            }
        }

        function onUserInput(block) {
            state.touched = true;
            state.computed = false;

            if (isFilled(block)) {
                state.kind[block] = 'input';
                if (!state.order.includes(block)) state.order.push(block);
            } else {
                state.kind[block] = 'empty';
                state.order = state.order.filter(b => b !== block);
            }

            applyAutoMode();
            render();
        }

        function setMode(mode) {
            if (state.mode === mode) return;
            state.mode = mode;

            // Le mode change le calcul de Tournage / Vidéo finale : un résultat déjà affiché devient périmé
            const hasStaleResult = ['t', 'vf'].some(b => state.kind[b] === 'result');
            if (hasStaleResult) state.computed = false;

            render();
        }

        function flashError(block) {
            const btn = $('blink-' + block);
            btn.hidden = false;
            btn.textContent = 'VALEUR À VÉRIFIER';
            setTimeout(() => { btn.textContent = 'CALCULER'; render(); }, 1800);
        }

        function compute(target) {
            const tSec = secondsOf('t');
            const vfSec = secondsOf('vf');
            const v = Number($('v_val').value);

            if (target === 'vf') {
                if (!(v > 0)) return flashError(target);
                setTime('vf', state.mode === 'ralent' ? tSec * v : tSec / v);

            } else if (target === 't') {
                if (!(v > 0)) return flashError(target);
                // Même règle dans les deux sens : accélération = ÷ vitesse, ralentissement = × vitesse
                setTime('t', state.mode === 'accel' ? vfSec / v : vfSec * v);

            } else { // 'v'
                if (!(vfSec > 0)) return flashError(target);
                $('v_val').value = (tSec / vfSec).toFixed(1);
            }

            state.kind[target] = 'result';
            state.computed = true;
            $('machineTitle').classList.add('animatePulse'); // invite à cliquer le titre pour réinitialiser
            render();
        }

        function resetAll() {
            Object.values(CHAMPS).flat().forEach(id => { $(id).value = ''; });
            state.kind = { t: 'empty', v: 'empty', vf: 'empty' };
            state.order = [];
            state.mode = null;
            state.computed = false;
            state.touched = false;
            $('machineTitle').classList.remove('animatePulse');
            $('t_seconds').textContent = '(0 seconde)';
            $('vf_seconds').textContent = '(0 seconde)';
            render();
        }

        // ---------- affichage ----------
        function render() {
            if (state.touched) {
                $('t_seconds').textContent = `total de secondes = ${Math.round(secondsOf('t'))} s`;
                $('vf_seconds').textContent = `total de secondes = ${Math.round(secondsOf('vf'))} s`;
            }

            // Unité (H / min / s) affichée seulement à côté d'une case remplie
            UNITES.forEach(([inputId, unitId, label]) => {
                $(unitId).textContent = $(inputId).value === '' ? '' : label;
            });

            // Blocs "allumés" : saisis, ou calculés ET à jour
            Object.keys(BLOCS).forEach(b => {
                const strong = state.kind[b] === 'input' || (state.kind[b] === 'result' && state.computed);
                $(BLOCS[b]).classList.toggle('strong', strong);
            });

            // Mode : flèches, libellé, symbole (les couleurs sont gérées en CSS via data-mode)
            root.dataset.mode = state.mode || 'none';
            $('v_type').textContent =
                state.mode === 'accel' ? 'ACCÉLÉRATION' :
                    state.mode === 'ralent' ? 'RALENTISSEMENT' : '(mode)';
            $('symboleVitesse').textContent = state.mode === 'ralent' ? '/' : 'X';

            // CALCULER clignote dans le bloc à calculer, tant que le résultat n'est pas à jour
            const target = getTarget();
            Object.keys(BLOCS).forEach(b => {
                $('blink-' + b).hidden = !(target === b && !state.computed);
            });
        }

        // ---------- écouteurs ----------
        Object.keys(CHAMPS).forEach(block => {
            CHAMPS[block].forEach(id => $(id).addEventListener('input', () => onUserInput(block)));
        });

        // Un élément "bouton" non natif (div) : clic + Entrée / Espace
        function onActivate(el, fn) {
            el.addEventListener('click', fn);
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
            });
        }

        onActivate($('flecheGauche'), () => setMode('accel'));
        onActivate($('flecheDroite'), () => setMode('ralent'));
        onActivate($('machineTitle'), resetAll);
        $('btnReset').addEventListener('click', () => {
            resetAll();
            window.scrollTo({ top: 0, behavior: 'smooth' }); // on revient en haut de la page, comme "Effacer tout"
        });
        Object.keys(BLOCS).forEach(b => onActivate($('blink-' + b), () => compute(b)));

        render();
    })();
</script>
