<!-- === 1. LE CONTENU === -->
<!-- Outil repris de l'appli Python "AppliRalentir" (page "Machine à Prendre le Temps") -->
<section class="tool-prepa" id="tool-prepa" data-mode="none">

    <h2 id="pt-machineTitle" class="pageTitle" role="button" tabindex="0" title="Cliquer pour tout réinitialiser">
        La Machine<br>
        à prendre le Temps
    </h2>

    <div id="mptPage">

        <!-- Zone Tournage -->
        <div class="bloc" id="pt-blocTournage">
            <h2 class="titreBloc">Tournage</h2>

            <div class="ligneChamps">
                <div class="champAvecUnite">
                    <input type="number" id="pt-t_h" placeholder="heures" min="0" step="any">
                    <span class="unit" id="pt-t_h_unit"></span>
                </div>
                <div class="champAvecUnite">
                    <input type="number" id="pt-t_m" placeholder="minutes" min="0" step="any">
                    <span class="unit" id="pt-t_m_unit"></span>
                </div>
                <div class="champAvecUnite">
                    <input type="number" id="pt-t_s" placeholder="secondes" min="0" step="any">
                    <span class="unit" id="pt-t_s_unit"></span>
                </div>
            </div>

            <div class="blinkCalc" id="pt-blink-t" role="button" tabindex="0" hidden>CALCULER</div>
            <div class="sousTexte" id="pt-t_seconds">(0 seconde)</div>
        </div>

        <!-- Zone Vitesse avec flèches -->
        <div class="ligneVitesse3cols">

            <!-- Colonne 1 : flèche ↓ = accélération -->
            <div class="colVitesse">
                <div id="pt-flecheGauche" class="fleche" role="button" tabindex="0" aria-label="Accélération">&#8595;
                </div>
            </div>

            <!-- Colonne 2 : bloc Vitesse -->
            <div class="colVitesse">
                <div class="bloc" id="pt-blocVitesse">
                    <h2 class="titreBloc">Vitesse</h2>

                    <div id="pt-v_type">(mode)</div>

                    <div class="vitesseInputRow">
                        <span id="pt-symboleVitesse" class="symboleVitesse">X</span>
                        <input type="number" id="pt-v_val" placeholder="----" min="0" step="any">
                    </div>

                    <div class="blinkCalc" id="pt-blink-v" role="button" tabindex="0" hidden>CALCULER</div>
                </div>
            </div>

            <!-- Colonne 3 : flèche ↑ = ralentissement -->
            <div class="colVitesse">
                <div id="pt-flecheDroite" class="fleche" role="button" tabindex="0" aria-label="Ralentissement">&#8593;
                </div>
            </div>

        </div>

        <!-- Zone Vidéo finale -->
        <div class="bloc" id="pt-blocVideo">
            <h2 class="titreBloc">Vidéo finale</h2>

            <div class="ligneChamps">
                <div class="champAvecUnite">
                    <input type="number" id="pt-vf_h" placeholder="heures" min="0" step="any">
                    <span class="unit" id="pt-vf_h_unit"></span>
                </div>
                <div class="champAvecUnite">
                    <input type="number" id="pt-vf_m" placeholder="minutes" min="0" step="any">
                    <span class="unit" id="pt-vf_m_unit"></span>
                </div>
                <div class="champAvecUnite">
                    <input type="number" id="pt-vf_s" placeholder="secondes" min="0" step="any">
                    <span class="unit" id="pt-vf_s_unit"></span>
                </div>
            </div>

            <div class="blinkCalc" id="pt-blink-vf" role="button" tabindex="0" hidden>CALCULER</div>
            <div class="sousTexte" id="pt-vf_seconds">(0 seconde)</div>
        </div>

    </div>

    <!-- Réinitialisation : remet tous les blocs à zéro -->
    <button type="button" id="pt-btnReset">Réinitialiser</button>
</section>

<style>
    /* Thème sombre (comme le métronome et "Convertir le temps") : fond transparent qui se confond avec la page,
       texte clair, blocs signalés par un ENCADRÉ de couleur (jamais de fond de couleur).
       Un bloc "éteint" a un encadré terne ; un bloc "allumé" (saisi ou calculé) a un encadré vif.
       Tout est limité à .tool-prepa ; on rétablit à l'intérieur les valeurs par défaut du navigateur que le CSS
       global du site modifie (box-sizing, marges, interligne). */

        max-width: 375px;
        margin: 0 auto;
        padding: 20px;

        color-scheme: dark;
        font-family: Arial, sans-serif;
        line-height: normal;

        border-radius: 6px;

    .tool-prepa input:focus {

        text-align: center;

    /* --- Blocs : encadré de couleur, fond transparent ---
       --dim    = encadré éteint
       --bright = encadré allumé (couleur vive)
       --tint   = fond du bloc allumé : la MÊME couleur que l'encadré, mais très translucide (20 %),
                  pour rester sur une teinte sombre. Pour un fond plus marqué, augmenter le dernier

       L'épaisseur de l'encadré ne change jamais (pas de "saut"). */
    .tool-prepa .bloc {
        padding: 10px;
        margin-bottom: 12px;
        border-radius: 10px;
        border: 3px solid var(--dim);
        background: transparent;
        transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .tool-prepa .bloc.strong {
        border-color: var(--bright);
        background: var(--tint);
        font-weight: bold;
    }

    .tool-prepa #pt-blocTournage {
        --dim: #375d43;
        --bright: #6fcf8d;
        --tint: rgba(111, 207, 141, 0.20);
        margin-top: 0;
    }

    /* vert */
    .tool-prepa #pt-blocVideo {
        --dim: #665a35;
        --bright: #e6c76a;
        --tint: rgba(230, 199, 106, 0.20);
    }

    /* jaune doré */
    .tool-prepa #pt-blocVitesse {
        --dim: #664840;
        --bright: #e59a86;
        --tint: rgba(229, 154, 134, 0.20);
    }

    /* corail */

    /* Vitesse allumée : la couleur (encadré ET fond) dépend du mode */

    /* gris : mode pas encore choisi */

<!-- === 3. LE SCRIPT (JAVASCRIPT) === -->
<script>
    // Logique de l'appli d'origine, réorganisée autour d'UN SEUL état et d'UNE SEULE fonction
    // d'affichage (render) : plus de couleurs modifiées à plusieurs endroits, plus de variables
    // globales, plus de bouton CALCULER recréé à chaque saisie.
    //
    // Principe : 3 blocs (Tournage "t", Vitesse "v", Vidéo finale "vf"). Quand 2 blocs sont
    // saisis par l'utilisateur, le 3e est calculé :
    //   • Tournage + Vitesse   → Vidéo finale  (accélération : vidéo = tournage ÷ vitesse)
    //   • Vidéo finale + Vitesse → Tournage    (ralentissement : tournage = vidéo × vitesse)
    //   • Tournage + Vidéo finale → Vitesse    (vitesse = tournage ÷ vidéo)
    (function () {
        const root = document.getElementById('tool-prepa');
        if (!root) return;

        const $ = (id) => document.getElementById('pt-' + id);

        const BLOCS = { t: 'blocTournage', v: 'blocVitesse', vf: 'blocVideo' };
        const CHAMPS = { t: ['t_h', 't_m', 't_s'], v: ['v_val'], vf: ['vf_h', 'vf_m', 'vf_s'] };
        const UNITES = [
            ['t_h', 't_h_unit', 'H'], ['t_m', 't_m_unit', 'min'], ['t_s', 't_s_unit', 's'],
            ['vf_h', 'vf_h_unit', 'H'], ['vf_m', 'vf_m_unit', 'min'], ['vf_s', 'vf_s_unit', 's']
        ];

        const state = {
            kind: { t: 'empty', v: 'empty', vf: 'empty' }, // 'empty' | 'input' (saisi) | 'result' (calculé)
            order: [],        // ordre dans lequel les blocs ont été saisis (sert à choisir le mode)
            mode: null,       // 'accel' | 'ralent' | null
            invert: false,    // true : relation inversée (vidéo = tournage × vitesse) ; false : vidéo = tournage ÷ vitesse
            live: false,      // MODE DIRECT : les 3 blocs sont remplis, modifier un bloc recalcule un autre instantanément
            dirChosen: false, // en mode direct : une flèche (ou le bloc Vitesse) a-t-elle été choisie ? (change quel bloc est recalculé)
            active: null,     // bloc dont un champ est en cours de saisie ('t' | 'v' | 'vf') ; reste mémorisé tant qu'on ne clique pas hors de l'outil
            computed: false,  // true juste après un CALCULER (résultat à jour)
            touched: false    // true dès la première saisie
        };

        // ---------- temps ----------
        function secondsOf(block) {
            const [h, m, s] = CHAMPS[block].map(id => Number($(id).value || 0));
            return h * 3600 + m * 60 + s;
        }

        function setTime(block, total) {
            const t = Math.max(0, Math.round(total)); // on arrondit AVANT de découper (plus de "60 s")
            const [h, m, s] = CHAMPS[block];
            $(h).value = Math.floor(t / 3600);
            $(m).value = Math.floor((t % 3600) / 60);
            $(s).value = t % 60;
        }

        // Un bloc de temps est "saisi" s'il représente une durée > 0 (les "0" laissés par un
        // calcul précédent ne comptent pas) ; la vitesse, dès qu'elle n'est pas vide.
        function isFilled(block) {
            if (block === 'v') return $('v_val').value !== '';
            return secondsOf(block) > 0;
        }

        // ---------- logique ----------
        // Les trois blocs sont reliés par UNE relation :  vidéo finale = tournage ÷ vitesse.
        //
        // • Deux blocs saisis  → le 3e est à CALCULER (bouton CALCULER).
        // • Trois blocs remplis → MODE DIRECT : on modifie un bloc, un autre se recalcule instantanément.
        //     - Au départ (aucune flèche cliquée) :
        //         Tournage modifié → Vidéo finale recalculée  (la Vitesse ne bouge pas)
        //         Vidéo finale modifiée → Tournage recalculé  (la Vitesse ne bouge pas)
        //     - Après un clic sur l'une des deux flèches :
        //         Tournage OU Vidéo finale modifié → c'est la Vitesse qui est recalculée
        //     - Dans tous les cas, Vitesse modifiée → le bloc désigné par la flèche est recalculé :
        //         flèche rouge ↓ (du Tournage vers la Vidéo finale) → Vidéo finale
        //         flèche bleue ↑ (de la Vidéo finale vers le Tournage) → Tournage
        const KEYS = Object.keys(BLOCS); // ['t', 'v', 'vf']
        const flip = (m) => (m === 'accel' ? 'ralent' : 'accel');
        const inputsList = () => KEYS.filter(b => state.kind[b] === 'input');

        // Le bloc à calculer = celui qui reste quand exactement 2 blocs sont saisis
        function getTarget() {
            const inputs = inputsList();
            if (inputs.length !== 2) return null;
            return KEYS.find(b => !inputs.includes(b));
        }

        // Mode "naturel" d'un bloc à calculer
        function autoMode(target) {
            if (target === 'vf') return 'accel';
            if (target === 't') return 'ralent';
            // Tournage saisi en premier → accélération ; Vidéo finale en premier → ralentissement
            return state.order.indexOf('t') < state.order.indexOf('vf') ? 'accel' : 'ralent';
        }

        // Mode utilisé = mode naturel, inversé si l'utilisateur a choisi l'autre flèche (relation inversée)
        function modeFor(target) {
            const m = autoMode(target);
            return state.invert && target !== 'v' ? flip(m) : m;
        }

        function applyAutoMode() {
            const target = getTarget();
            if (target) state.mode = modeFor(target);
        }

        // Bloc entièrement vide (aucun champ rempli). Un champ à "0" n'est PAS vide.
        function isBlank(block) {
            return CHAMPS[block].every(id => $(id).value === '');
        }

        function clearBlock(block) {
            CHAMPS[block].forEach(id => { $(id).value = ''; });
        }

        function touchOrder(block) {
            state.order = state.order.filter(b => b !== block);
            state.order.push(block); // le plus récent à la fin
        }

        // Calcule le bloc "target" à partir des deux autres. Renvoie false si les valeurs sont inutilisables.
        function calcTarget(target) {
            const tSec = secondsOf('t');
            const vfSec = secondsOf('vf');
            const v = Number($('v_val').value);
            const inv = state.invert;

            if (target === 'vf') {
                if (!(v > 0)) return false;
                setTime('vf', inv ? tSec * v : tSec / v);

            } else if (target === 't') {
                if (!(v > 0)) return false;
                setTime('t', inv ? vfSec / v : vfSec * v);

            } else { // 'v'
                const value = inv ? vfSec / tSec : tSec / vfSec;
                if (!(isFinite(value) && value > 0)) return false;
                $('v_val').value = value.toFixed(1);
            }
            return true;
        }

        // Mode direct : quel bloc est recalculé quand on modifie "block" ?
        function liveDependent(block) {
            if (block === 'v') return state.mode === 'ralent' ? 't' : 'vf'; // le bloc désigné par la flèche
            if (state.dirChosen) return 'v';                                 // une flèche a été cliquée
            return block === 't' ? 'vf' : 't';                               // Tournage <-> Vidéo finale
        }

        function liveEdit(block) {
            const dep = liveDependent(block);
            KEYS.forEach(b => { state.kind[b] = (b === dep ? 'result' : 'input'); });
            touchOrder(block);
            // résultat à jour, ou périmé (CALCULER clignote) si les valeurs sont inutilisables
            state.computed = calcTarget(dep);
        }

        function onUserInput(block) {
            state.touched = true;
            state.computed = false;
            state.active = block;

            // ---- Mode direct (3 blocs remplis) : on modifie un bloc, un autre suit ----
            // (tant que le bloc modifié n'est pas entièrement vidé : en passant d'un champ à l'autre, un "0"
            //  transitoire ne doit pas faire sortir du mode direct)
            if (state.live && !isBlank(block)) {
                liveEdit(block);
                render();
                return;
            }

            if (isFilled(block)) {
                const inputs = inputsList();

                if (inputs.length === 2 && state.kind[block] !== 'input') {
                    // Deux blocs saisis, le 3e (vide) est celui qu'on CALCULE : on ne le remplit pas à la main.
                    // Si on le remplit quand même, on repart de zéro avec CE bloc seul :
                    // les deux autres sont vidés et éteints, comme pour un nouveau calcul.
                    KEYS.filter(b => b !== block).forEach(b => {
                        clearBlock(b);
                        state.kind[b] = 'empty';
                    });
                    state.order = [];
                    state.mode = null;
                    state.invert = false;
                    $('machineTitle').classList.remove('animatePulse');
                }
                state.kind[block] = 'input';
                touchOrder(block);

            } else {
                state.kind[block] = 'empty';
                state.order = state.order.filter(b => b !== block);
                // Un bloc est vidé alors que les trois étaient remplis : on quitte le mode direct.
                // L'ancien résultat devient une donnée (il garde sa valeur) et le bloc vidé est à recalculer.
                state.live = false;
                state.dirChosen = false;
                KEYS.filter(b => state.kind[b] === 'result').forEach(r => {
                    state.kind[r] = 'input';
                    if (!state.order.includes(r)) state.order.unshift(r);
                });
            }

            applyAutoMode();
            if (!getTarget()) state.invert = false;
            render();
        }

        // Clic sur un BLOC (en dehors de ses champs), en mode direct : parmi les deux autres blocs,
        // on choisit celui qui sera recalculé quand on modifie le champ actif.
        function onBlockClick(clicked) {
            if (!state.live || !state.active || clicked === state.active) return;

            if (state.active === 'v') {
                // Vitesse en cours de saisie : le bloc cliqué est celui qui sera recalculé (comme les flèches)
                state.mode = clicked === 't' ? 'ralent' : 'accel';
                state.dirChosen = true;
            } else if (clicked === 'v') {
                state.dirChosen = true;   // la Vitesse sera recalculée
            } else {
                state.dirChosen = false;  // l'autre bloc (Tournage <-> Vidéo finale) : comportement par défaut
            }
            render();
        }

        // Flèches accélération (rouge ↓) / ralentissement (bleue ↑)
        function setMode(mode) {
            // Mode direct : la flèche choisit le bloc recalculé quand on modifie la Vitesse,
            // et fait recalculer la Vitesse (au lieu de l'autre bloc) quand on modifie Tournage ou Vidéo finale.
            // Cliquer une flèche ne change aucune valeur.
            if (state.live) {
                state.mode = mode;
                state.dirChosen = true;
                render();
                return;
            }

            if (state.mode === mode) return;
            state.mode = mode;

            // Avant le calcul : pour Tournage / Vidéo finale, choisir la flèche "non naturelle" inverse la relation
            const target = getTarget();
            if (target && target !== 'v') state.invert = (mode !== autoMode(target));
            render();
        }

        function flashError(block) {
            const btn = $('blink-' + block);
            btn.hidden = false;
            btn.textContent = 'VALEUR À VÉRIFIER';
            setTimeout(() => { btn.textContent = 'CALCULER'; render(); }, 1800);
        }

        // Bouton CALCULER (deux blocs saisis) : calcule le 3e, puis on passe en mode direct
        function compute(target) {
            if (!calcTarget(target)) return flashError(target);

            state.kind[target] = 'result';
            state.computed = true;
            if (!state.live) {
                state.live = true;
                state.dirChosen = false;
            }
            state.active = null; // juste après le calcul : aucun champ actif, les trois encadrés sont discrets
            $('machineTitle').classList.add('animatePulse'); // invite à cliquer le titre pour réinitialiser
            render();
        }

        function resetAll() {
            Object.values(CHAMPS).flat().forEach(id => { $(id).value = ''; });
            state.kind = { t: 'empty', v: 'empty', vf: 'empty' };
            state.order = [];
            state.mode = null;
            state.invert = false;
            state.live = false;
            state.dirChosen = false;
            state.active = null;
            state.computed = false;
            state.touched = false;
            $('machineTitle').classList.remove('animatePulse');
            $('t_seconds').textContent = '(0 seconde)';
            $('vf_seconds').textContent = '(0 seconde)';
            render();
        }

        // ---------- affichage ----------
        function render() {
            // Mode direct : on repère le bloc en cours de saisie et le bloc qui sera recalculé
            root.classList.toggle('live', state.live);
            const highlighted = new Set();
            if (state.live && state.active) {
                highlighted.add(state.active);
                highlighted.add(liveDependent(state.active));
            }
            KEYS.forEach(b => $(BLOCS[b]).classList.toggle('hl', highlighted.has(b)));

            if (state.touched) {
                $('t_seconds').textContent = `total de secondes = ${Math.round(secondsOf('t'))} s`;
                $('vf_seconds').textContent = `total de secondes = ${Math.round(secondsOf('vf'))} s`;
            }

            // Unité (H / min / s) affichée seulement à côté d'une case remplie
            UNITES.forEach(([inputId, unitId, label]) => {
                $(unitId).textContent = $(inputId).value === '' ? '' : label;
            });

            // Blocs "allumés" : saisis, ou calculés ET à jour
            Object.keys(BLOCS).forEach(b => {
                const strong = state.kind[b] === 'input' || (state.kind[b] === 'result' && state.computed);
                $(BLOCS[b]).classList.toggle('strong', strong);
            });

            // Mode : flèches, libellé, symbole (les couleurs sont gérées en CSS via data-mode)
            root.dataset.mode = state.mode || 'none';
            $('v_type').textContent =
                state.mode === 'accel' ? 'ACCÉLÉRATION' :
                    state.mode === 'ralent' ? 'RALENTISSEMENT' : '(mode)';
            $('symboleVitesse').textContent = state.mode === 'ralent' ? '/' : 'X';

            // CALCULER clignote dans le bloc à calculer, tant que le résultat n'est pas à jour
            const target = getTarget();
            Object.keys(BLOCS).forEach(b => {
                $('blink-' + b).hidden = !(target === b && !state.computed);
            });
        }

        // ---------- roulette de la souris ----------
        // En plus de la saisie au clavier et des flèches haut/bas du champ : dans un champ sélectionné (cliqué),
        // défiler vers le HAUT = flèche haut (+1), défiler vers le BAS = flèche bas (-1).
        // Plus le défilement est rapide et fort, plus les chiffres défilent vite.
        const WHEEL_NEEDS_FOCUS = true; // true : le champ doit avoir été cliqué (la page défile normalement sinon)
        const PX_PER_UNIT = 100;        // un cran de molette de souris (~100 px) = 1 unité à vitesse normale
        const FAST_FROM = 800;          // au-delà de cette vitesse de défilement (px/s), les chiffres accélèrent
        const FAST_RANGE = 1200;        // plus cette valeur est petite, plus l'accélération est brutale
        const MAX_FACTOR = 12;          // accélération maximale (×12)

        function wheelPixels(e) {
            let d = e.deltaY;
            if (e.deltaMode === 1) d *= 33;       // "lignes" (Firefox avec une souris) -> pixels
            else if (e.deltaMode === 2) d *= 400; // "pages"
            return d;
        }

        function enableWheel(field) {
            let acc = 0;   // fraction d'unité en attente
            let vel = 0;   // vitesse de défilement lissée (px/s)
            let last = 0;

            field.addEventListener('wheel', (e) => {
                if (WHEEL_NEEDS_FOCUS && document.activeElement !== field) return;

                const d = wheelPixels(e);
                if (!d) return;
                e.preventDefault();

                const now = performance.now();
                const dt = Math.max(now - last, 8);
                vel = dt > 300 ? 0 : 0.5 * vel + 0.5 * (Math.abs(d) / dt * 1000); // nouvelle séquence si pause
                last = now;

                const factor = Math.min(MAX_FACTOR, 1 + Math.max(0, vel - FAST_FROM) / FAST_RANGE);
                const sign = d < 0 ? 1 : -1; // vers le haut = augmente
                if (acc !== 0 && Math.sign(acc) !== sign) acc = 0; // changement de sens : on repart de zéro

                // Un vrai "cran" de molette (≥ 40 px) vaut toujours au moins 1 unité ;
                // les petits défilements du pavé tactile s'accumulent en fractions.
                const abs = Math.abs(d);
                const base = abs >= 40 ? Math.max(1, Math.round(abs / PX_PER_UNIT)) : abs / PX_PER_UNIT;
                acc += sign * base * factor;

                const steps = Math.trunc(acc);
                if (steps === 0) return;
                acc -= steps;

                const min = field.min !== '' ? Number(field.min) : -Infinity;
                const next = Math.max(min, (Number(field.value) || 0) + steps);
                field.value = String(+next.toFixed(10)); // évite 0.30000000000000004
                field.dispatchEvent(new Event('input', { bubbles: true })); // comme une saisie au clavier
            }, { passive: false });
        }

        // ---------- écouteurs ----------
        Object.keys(CHAMPS).forEach(block => {
            CHAMPS[block].forEach(id => {
                $(id).addEventListener('input', () => onUserInput(block));
                $(id).addEventListener('focus', () => { state.active = block; render(); }); // ce bloc devient "actif"
                enableWheel($(id));
            });
        });

        // Clic sur un bloc : choix du bloc recalculé. Le "mousedown" est neutralisé pour que le champ en cours de
        // saisie GARDE le focus (la roulette et le clavier continuent de fonctionner).
        KEYS.forEach(b => {
            const el = $(BLOCS[b]);
            el.addEventListener('mousedown', (e) => {
                if (state.live && state.active && !e.target.closest('input')) e.preventDefault();
            });
            el.addEventListener('click', (e) => {
                if (e.target.closest('input')) return;
                onBlockClick(b);
            });
        });

        ['flecheGauche', 'flecheDroite'].forEach(id => {
            $(id).addEventListener('mousedown', (e) => { if (state.live && state.active) e.preventDefault(); });
        });

        // Un clic EN DEHORS de l'outil éteint les encadrés (plus de champ actif)
        function onOutsidePointer(e) {
            if (!root.isConnected) { document.removeEventListener('pointerdown', onOutsidePointer); return; }
            if (state.active && !root.contains(e.target)) { state.active = null; render(); }
        }
        document.addEventListener('pointerdown', onOutsidePointer);

        // Un élément "bouton" non natif (div) : clic + Entrée / Espace
        function onActivate(el, fn) {
            el.addEventListener('click', fn);
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
            });
        }

        onActivate($('flecheGauche'), () => setMode('accel'));
        onActivate($('flecheDroite'), () => setMode('ralent'));
        onActivate($('machineTitle'), resetAll);
        $('btnReset').addEventListener('click', () => {
            resetAll();
            window.scrollTo({ top: 0, behavior: 'smooth' }); // on revient en haut de la page, comme "Effacer tout"
        });
        Object.keys(BLOCS).forEach(b => onActivate($('blink-' + b), () => compute(b)));

        render();
    })();
</script>
