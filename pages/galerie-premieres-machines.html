<!-- === 2. LE STYLE (CSS) === -->
<style>
    .galerie-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0px 20px 40px 20px;
        /* Padding haut à 0 pour coller au menu */
    }

    /* Styles des boutons de sous-menu en cascade */
    .sub-nav-buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 0;
        margin-bottom: 30px;
        flex-wrap: wrap;
    }

    .sub-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 8px 20px;
        border-radius: 30px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 1px;
        color: #bbb;
        text-transform: uppercase;
        transition: all 0.3s ease;

        opacity: 0;
        transform: translateX(-30px);
        animation: cascadeIn 0.6s ease forwards;
    }

    .sub-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
    }

    .sub-btn.active {
        background: #fff;
        color: #111;
        border-color: #fff;
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    @keyframes cascadeIn {
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    /* Disposition en grille pour les vidéos */
    .videos-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 30px;
    }

    .video-item {
        background: #161616;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .video-item:hover {
        transform: translateY(-4px);
        border-color: rgba(255, 255, 255, 0.2);
    }

    .gallery-video {
        width: 100%;
        display: block;
        object-fit: cover;
    }

    .video-info {
        padding: 18px 20px;
    }

    .video-info h3 {
        color: #ffffff;
        font-family: 'Avenir', sans-serif;
        font-size: 1.1rem;
        font-weight: 600;
    }

    @media (max-width: 768px) {
        .videos-grid {
            grid-template-columns: 1fr;
        }
    }
</style>


<!-- === 3. LE SCRIPT (JAVASCRIPT) === -->
<script>
    (function () {
        document.querySelectorAll('.gallery-video').forEach(video => {
            let hasStarted = false;
            video.addEventListener('play', function () {
                if (!hasStarted) {
                    this.currentTime = 0;
                    hasStarted = true;
                }
            });
        });
    })();
</script>
