<!-- === 1. LE CONTENU === -->
<section class="evenements-section-wrapper">

    <!-- Barre de sous-menus fixe (jamais de fondu ni de mouvement).
         L'état "active" des boutons est géré par loadSubPage() dans script.js. -->
    <nav class="sub-nav-buttons">
        <button type="button" class="sub-btn" data-subpage="evenements-passe"
            onclick="loadSubPage('evenements-passe')">Passé</button>
        <button type="button" class="sub-btn" data-subpage="evenements-actualite"
            onclick="loadSubPage('evenements-actualite')">Actualité</button>
        <button type="button" class="sub-btn" data-subpage="evenements-avenir"
            onclick="loadSubPage('evenements-avenir')">À venir</button>
    </nav>

    <!-- Conteneur de la sous-page (lui subit le fondu au noir de 200ms) -->
    <div id="sub-page-content" class="sub-page-content"></div>

</section>

<!-- === 2. LE STYLE === -->
<!-- Le CSS du conteneur et de la barre de sous-menus est dans style.css -->


<!-- === 3. LE SCRIPT === -->
<script>
    // Au chargement de la page Évènements : sous-page demandée par le menu / l'URL
    // (window.pendingSubPage), sinon "Passé" par défaut.
    loadSubPage(window.pendingSubPage || 'evenements-actualite');
    window.pendingSubPage = ''; // Reset (l'ancienne version avait une faute : "pendingSubpage")
</script>
