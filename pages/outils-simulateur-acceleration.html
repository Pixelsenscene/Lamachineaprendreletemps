<!-- === 1. LE CONTENU === -->
<section class="tool-simu" id="tool-simu">

    <h2 class="titreTool" data-help-title>Simulateur d'accélération</h2>

    <!-- Vidéo brute : ni commandes, ni pause, ni plein écran.
         Deux vidéos superposées : la page passe de l'une à l'autre (fondu) quand le curseur
         change de palier de vitesse. -->
    <!-- Lien "plein écran" : juste au-dessus de la vidéo, en haut à droite -->
    <div class="simuTop">
        <button type="button" id="simu-full" class="fsLink" aria-label="Afficher la vidéo en plein écran">plein
            écran</button>
    </div>

    <div class="simuStage" id="simu-stage">
        <video id="simu-video-a" class="front" muted loop playsinline preload="none" tabindex="-1"
            disablePictureInPicture disableRemotePlayback controlsList="nodownload nofullscreen noremoteplayback"
            aria-label="Vidéo de démonstration"></video>
        <video id="simu-video-b" muted loop playsinline preload="none" tabindex="-1" aria-hidden="true"
            disablePictureInPicture disableRemotePlayback
            controlsList="nodownload nofullscreen noremoteplayback"></video>

        <!-- Écran de lancement : disparaît quand la vidéo est prête -->
        <div class="simuStart" id="simu-start">
            <button type="button" id="simu-load">Lancer la simulation</button>
            <p class="simuNote" id="simu-note"></p>
        </div>
    </div>

    <!-- Curseur de vitesse -->
    <div class="bloc blocVitesse">
        <div class="mtLabel">Vitesse de lecture</div>
        <div class="speedValue"><span class="speedNum">&times;<span id="simu-speed">1</span></span><span
                class="speedTag" id="simu-tag"></span></div>
        <input type="range" id="simu-slider" min="0" max="100" step="0.5" value="0"
            aria-label="Vitesse de lecture, de ×1 à ×25">
        <div class="scale"><span>&times;1</span><span>&times;25</span></div>
        <div class="simuInfo" id="simu-info">&nbsp;</div>
        <div class="simuFile" id="simu-file"></div>
    </div>

    <!-- TEXTE DU BOUTON "?" (explication de l'outil), affiché dans une fenêtre posée sur l'outil.
         • <p> = un paragraphe, <br> = un retour à la ligne.
         • Un mot peut ouvrir une vidéo :  <button type="button" class="helpLink" data-video="adresse de la vidéo" data-loop>mot</button>
           (data-loop = en boucle ; sans data-loop, la vidéo se joue une fois). Un clic sur la vidéo ramène à l'explication.
         • Le "?" est placé sur les titres qui portent l'attribut  data-help-title  (code : aide-outils.js). -->
    <template class="toolHelpContent">
        <p>L'accélération appliquée est proportionnelle à la lenteur des mouvements lors du tournage.<br>
            Plus les mouvements ont été lents (Tournage) plus l'accélération est grande (Montage) afin d'approcher un
            rendu final où les mouvements semblent être "à vitesse réelle".<br>
            Pour cette vidéo l'accélération fut de 25 fois.</p>
        <p>Selon l'élément à rendre rapide en arrière fond cette accélération varie au montage.<br>
            Par exemple une accélération X10 peut suffire pour avoir une foule très rapide (exemple : <button
                type="button" class="helpLink"
                data-video="https://MaptDiff.b-cdn.net/Vid%C3%A9os%20Format%20Insta%20Verti/rire%20char%20a%CC%80%20voile-SiteWeb%20MPEG-4.mp4"
                data-loop>Chars à voile</button>).<br>
            Pour la course du soleil, une accélération beaucoup plus importante est nécessaire.<br>
            C'est le cas de la vidéo "<button type="button" class="helpLink"
                data-video="https://MaptDiff.b-cdn.net/Vid%C3%A9os%20Format%20Insta%20Verti/griffe-SiteWeb%20MPEG-4.mp4"
                data-loop>Griffe</button>" qui a été accélérée 400 fois (20 min filmées = 3 sec montage final)</p>
    </template>

</section>

<!-- Bouton "?" : le code est dans aide-outils.js (chargé une seule fois). S'il manque, seul le "?" est absent. -->
<script>
    (function () {
        function go() { if (window.MPTAide) window.MPTAide.attach(document.getElementById('tool-simu')); }
        if (window.MPTAide) { go(); return; }
        var s = document.createElement('script');
        s.src = 'aide-outils.js';
        s.onload = go;
        document.head.appendChild(s);
    })();
</script>

<!-- === 3. LE SCRIPT (JAVASCRIPT) === -->
<script>
    // Simulateur d'accélération par PALIERS DE VITESSE.
    // La vidéo existe en 10 versions : la version "×4,2" ne garde qu'une image sur 4,2 de l'originale et se lit
    // à vitesse normale. Le curseur choisit la version la plus proche de la vitesse voulue, puis ajuste finement
    // la vitesse de lecture (toujours entre ×0,9 et ×1,6 : un réglage très léger pour le navigateur).
    // Quand on change de version, la nouvelle est préparée en arrière-plan à la position équivalente,
    // puis on passe de l'une à l'autre en fondu.
    // Tout est dans une fonction : aucune variable globale, et tout est nettoyé quand on quitte la page.
    (function () {
        const root = document.getElementById('tool-simu');
        if (!root) return;

        const $ = (id) => document.getElementById('simu-' + id);

        // ---------------------------------------------------------------- réglages
        const BASE_URL = 'https://MaptDiff.b-cdn.net/RALENTIS%20VR%20paysage/';
        const FILE_PREFIX = 'ziozio_x';
        // Les fichiers sont nommés ziozio_x + (vitesse × 100) + ".mp4", par exemple ziozio_x2500.mp4 pour ×25.
        // (Plusieurs extensions peuvent être listées : la page les essaie dans l'ordre.)
        const EXTENSIONS = ['mp4'];
        // Les 10 paliers (doit correspondre aux fichiers envoyés sur Bunny)
        const LADDER = [1, 1.4, 2, 2.9, 4.2, 6, 8.5, 12, 17, 25];
        const SPEED_MIN = LADDER[0];
        const SPEED_MAX = LADDER[LADDER.length - 1];
        const SOURCE_SECONDS = 7 * 60 + 56; // durée de la vidéo d'origine (7 min 56 s)
        // 'log'    : chaque pas du curseur multiplie la vitesse (le milieu du curseur = ×5)
        // 'linear' : proportionnel (le milieu du curseur = ×13)
        const SCALE = 'log';
        const AUTO_START = true;            // true : la lecture démarre dès l'ouverture de la page (à vitesse réelle)
        const SWITCH_DEBOUNCE_MS = 150;     // attente avant de changer de version quand on déplace le curseur
        const MIN_RATE = 0.9;               // une version reste utilisée tant que sa vitesse de lecture est dans [0,9 ; 1,6[
        const MAX_RATE = 1.6;
        const BOOST_MAX = 4;                // vitesse max du fichier en cours pendant qu'on charge le suivant
        const LOAD_TIMEOUT_MS = 20000;
        const SETTLE_DELAY_MS = 700;        // curseur immobile : on passe au palier le plus proche de la vitesse voulue
        const PREFETCH_DELAY_MS = 1500;     // le palier voisin est préchargé quand le curseur ne bouge plus

        const slider = $('slider');
        const stage = $('stage');
        const videos = [$('video-a'), $('video-b')];

        let front = 0;          // vidéo actuellement visible (0 ou 1)
        let ci = 0;             // palier lu par la vidéo visible
        let si = -1;            // palier chargé (ou en cours de chargement) dans l'autre vidéo
        let target = -1;        // palier vers lequel on bascule (-1 = aucun)
        let token = 0;          // permet d'annuler une bascule devenue inutile
        let running = false;
        let starting = false;   // chargement du premier fichier en cours
        let autoPending = false; // démarrage automatique en attente (onglet ouvert en arrière-plan)
        let interacted = false; // le visiteur a-t-il touché au curseur ? (le préchargement n'a lieu qu'ensuite)
        let extIndex = 0;
        let lastDir = 1;
        let lastSlider = 0;
        let debounceTimer = null;
        let settleTimer = null;
        let idleTimer = null;
        const failed = new Set(); // paliers impossibles à charger

        const activeVideo = () => videos[front];
        const standbyVideo = () => videos[1 - front];
        const urlFor = (i) => `${BASE_URL}${FILE_PREFIX}${Math.round(LADDER[i] * 100)}.${EXTENSIONS[extIndex]}`;

        // ---------------------------------------------------------------- vitesse
        function speedFromSlider(p) {
            const t = p / 100;
            return SCALE === 'linear'
                ? SPEED_MIN + (SPEED_MAX - SPEED_MIN) * t
                : SPEED_MIN * Math.pow(SPEED_MAX / SPEED_MIN, t);
        }
        const currentSpeed = () => speedFromSlider(Number(slider.value));

        function detectNativeMax() {
            const probe = document.createElement('video');
            for (const r of [25, 16, 8, 5, 4, 2]) {
                try {
                    probe.playbackRate = r;
                    if (probe.playbackRate === r) return r;
                } catch (e) { /* refusée : on essaie la suivante */ }
            }
            return 1;
        }
        const nativeMax = detectNativeMax();

        function setRate(video, r) {
            const rate = Math.max(0.25, Math.min(r, nativeMax));
            try {
                video.defaultPlaybackRate = rate; // le navigateur la remet à chaque changement de source
                video.playbackRate = rate;
            } catch (e) { /* vitesse non prise en charge */ }
        }

        // Palier idéal = le plus grand palier inférieur ou égal à la vitesse voulue (en sautant ceux qui ont échoué)
        function chooseFile(S) {
            let idx = 0;
            for (let i = 0; i < LADDER.length; i++) if (LADDER[i] <= S + 1e-9) idx = i;
            while (idx > 0 && failed.has(idx)) idx--;
            return idx;
        }

        // Position équivalente dans un autre palier : on garde le même moment de la vidéo d'origine
        function mapTime(t, fromIdx, toIdx, duration) {
            let m = t * LADDER[fromIdx] / LADDER[toIdx];
            if (isFinite(duration) && duration > 0) m = m % duration;
            return m;
        }

        // ---------------------------------------------------------------- affichage
        const fmt = (n) => n.toLocaleString('fr-FR', { maximumFractionDigits: 1 });

        function fmtDuration(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.round(sec % 60);
            return m > 0 ? `${m} min ${String(s).padStart(2, '0')} s` : `${s} s`;
        }

        // Zone de message sous le curseur : vide en fonctionnement normal, utilisée uniquement pour signaler une erreur
        function updateFileInfo(message) {
            $('file').textContent = message || '';
        }

        function updateDisplay(S) {
            $('speed').textContent = fmt(S);
            const p = Number(slider.value);
            $('tag').textContent = p <= 0 ? '(vitesse réelle)' : '';
            $('info').textContent =
                `La vidéo (${fmtDuration(SOURCE_SECONDS)}) défile en ${fmtDuration(SOURCE_SECONDS / S)} à cette vitesse.`;
        }

        // ---------------------------------------------------------------- chargement
        function waitFor(video, events, ms) {
            return new Promise((resolve, reject) => {
                const timer = setTimeout(() => finish(new Error('timeout')), ms);
                const onOk = () => finish();
                const onErr = () => finish(new Error('media'));
                function finish(err) {
                    clearTimeout(timer);
                    events.forEach(e => video.removeEventListener(e, onOk));
                    video.removeEventListener('error', onErr);
                    if (err) reject(err); else resolve();
                }
                events.forEach(e => video.addEventListener(e, onOk));
                video.addEventListener('error', onErr);
            });
        }

        // Charge un palier dans une vidéo. Si l'extension ne marche pas, on essaie la suivante.
        async function loadFile(video, i) {
            for (; ;) {
                video.preload = 'auto';
                video.src = urlFor(i);
                video.defaultPlaybackRate = 1;
                video.load();
                try {
                    await waitFor(video, ['canplay'], LOAD_TIMEOUT_MS);
                    return;
                } catch (e) {
                    if (e.message === 'media' && extIndex < EXTENSIONS.length - 1) { extIndex++; continue; }
                    throw e;
                }
            }
        }

        async function seekTo(video, t) {
            if (Math.abs(video.currentTime - t) < 0.01) return; // aucun déplacement : pas d'événement "seeked"
            video.currentTime = t;
            await waitFor(video, ['seeked'], LOAD_TIMEOUT_MS);
            if (video.readyState < 3) await waitFor(video, ['canplay'], LOAD_TIMEOUT_MS);
        }

        // Attend qu'une image de la vidéo soit réellement affichée (pour ne pas faire un fondu vers du noir)
        function framePresented(video) {
            return new Promise((resolve) => {
                if (typeof video.requestVideoFrameCallback === 'function') {
                    video.requestVideoFrameCallback(() => resolve());
                    setTimeout(resolve, 400); // sécurité
                } else {
                    setTimeout(resolve, 80);
                }
            });
        }

        // ---------------------------------------------------------------- changement de palier
        async function doSwitch(ti) {
            const my = ++token;
            target = ti;
            updateFileInfo();

            const cur = activeVideo();
            const next = standbyVideo();

            try {
                // 1. la nouvelle version est chargée dans la vidéo "de réserve" (déjà prête si elle a été préchargée)
                if (si === ti) {
                    if (next.readyState < 3) await waitFor(next, ['canplay'], LOAD_TIMEOUT_MS);
                } else {
                    si = ti;
                    await loadFile(next, ti);
                }
                if (my !== token) return;

                // 2. on se place à la position équivalente, puis on se recale (le temps a avancé pendant le chargement)
                await seekTo(next, mapTime(cur.currentTime, ci, ti, next.duration));
                if (my !== token) return;
                const t2 = mapTime(cur.currentTime, ci, ti, next.duration);
                if (Math.abs(t2 - next.currentTime) > 0.05) {
                    await seekTo(next, t2);
                    if (my !== token) return;
                }

                // 3. lecture, puis fondu dès qu'une image est affichée
                setRate(next, currentSpeed() / LADDER[ti]);
                await next.play();
                await framePresented(next);
                if (my !== token) { next.pause(); return; }

                // La nouvelle vidéo apparaît en fondu PAR-DESSUS l'ancienne, qui reste visible jusqu'au bout
                const old = cur;
                next.classList.remove('back');
                next.classList.add('front');
                old.classList.remove('front');
                old.classList.add('back');
                front = 1 - front;
                const previous = ci;
                ci = ti;
                si = previous;      // l'ancienne version reste chargée : un retour en arrière est instantané
                target = -1;
                setTimeout(() => {
                    if (activeVideo() !== old) { old.classList.remove('back'); old.pause(); }
                }, 250);

                applySpeed();
                updateFileInfo();
                scheduleIdlePrefetch();
            } catch (e) {
                if (my !== token) return;
                failed.add(ti);
                si = -1;
                target = -1;
                updateFileInfo(`La version \u00d7${fmt(LADDER[ti])} n\u2019a pas pu être chargée.`);
            }
        }

        // Le curseur a bougé : faut-il changer de palier ?
        function applySpeed() {
            const S = currentSpeed();
            updateDisplay(S);
            if (!running) return;

            const r = S / LADDER[ci];
            const stillOk = r >= MIN_RATE && r < MAX_RATE;

            if (stillOk) {
                if (target >= 0) { token++; target = -1; } // on est revenu : on annule la bascule en cours
            } else {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    if (!running) return;
                    const speed = currentSpeed();
                    const rr = speed / LADDER[ci];
                    if (rr >= MIN_RATE && rr < MAX_RATE) return;
                    const ti = chooseFile(speed);
                    if (ti !== ci && ti !== target) doSwitch(ti);
                }, SWITCH_DEBOUNCE_MS);
            }

            // Vitesse de la vidéo visible. Pendant qu'une autre version se charge, on laisse monter la vitesse
            // du fichier en cours (jusqu'à ×4) pour que le curseur reste réactif.
            const waiting = target >= 0 || r >= MAX_RATE || r < MIN_RATE;
            setRate(activeVideo(), waiting ? Math.min(Math.max(r, 0.25), BOOST_MAX) : r);
            updateFileInfo();
            scheduleSettle();
            scheduleIdlePrefetch();
        }

        // Curseur immobile : si le palier en cours n'est pas le plus proche de la vitesse voulue
        // (la tolérance sert surtout à éviter les allers-retours pendant le déplacement), on passe au meilleur.
        function scheduleSettle() {
            clearTimeout(settleTimer);
            settleTimer = setTimeout(() => {
                if (!running) return;
                const ti = chooseFile(currentSpeed());
                if (ti !== ci && ti !== target) doSwitch(ti);
            }, SETTLE_DELAY_MS);
        }

        // Quand le curseur ne bouge plus, on précharge le palier voisin dans la direction du mouvement
        function scheduleIdlePrefetch() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if (!running || target >= 0 || !interacted) return; // pas de préchargement tant que le curseur n'a pas bougé
                const idx = ci + lastDir;
                if (idx < 0 || idx >= LADDER.length || failed.has(idx) || si === idx) return;
                si = idx;
                loadFile(standbyVideo(), idx).catch(() => { si = -1; failed.add(idx); });
            }, PREFETCH_DELAY_MS);
        }

        // ---------------------------------------------------------------- lancement
        async function start() {
            if (running || starting) return;
            starting = true;

            // Pendant le chargement : un simple message, sans bouton
            $('start').hidden = false;
            $('load').hidden = true;
            $('note').textContent = 'Chargement\u2026';

            const S = currentSpeed();
            const first = chooseFile(S);
            const av = activeVideo();
            ci = first;
            si = -1;

            try {
                await loadFile(av, first);
            } catch (e) {
                starting = false;
                $('load').hidden = false;
                $('load').disabled = false;
                $('note').textContent =
                    `Impossible de lire ${FILE_PREFIX}${Math.round(LADDER[first] * 100)}.${EXTENSIONS[extIndex]}. ` +
                    `Vérifiez que les fichiers sont bien en MP4 (H.264), avec ce nom, dans le bon dossier.`;
                return;
            }

            try {
                setRate(av, S / LADDER[first]);
                await av.play();
            } catch (e) {
                // Lecture automatique refusée (mode économie d'énergie, économiseur de données...) : on propose le bouton
                starting = false;
                $('load').hidden = false;
                $('load').disabled = false;
                $('note').textContent = '';
                return;
            }

            starting = false;
            running = true;
            $('start').hidden = true;
            applySpeed();
        }

        // Connexion lente ou économiseur de données activé : pas de démarrage automatique
        function connectionIsLimited() {
            const c = navigator.connection;
            return !!(c && (c.saveData || /^(slow-)?2g$|^3g$/.test(c.effectiveType || '')));
        }

        // ---------------------------------------------------------------- clic et plein écran
        // Retour au début de la vidéo (à la même vitesse)
        function resetVideo() {
            const v = activeVideo();
            try { v.currentTime = 0; } catch (e) { /* vidéo pas encore prête */ }
        }

        function isFull() {
            return document.fullscreenElement === stage || document.webkitFullscreenElement === stage ||
                stage.classList.contains('pseudoFull');
        }

        function setPseudoFull(on) {
            stage.classList.toggle('pseudoFull', on);
            document.body.classList.toggle('simu-pseudo-full', on);
        }

        function enterFull() {
            const request = stage.requestFullscreen || stage.webkitRequestFullscreen;
            if (request) {
                try {
                    const p = request.call(stage);
                    if (p && typeof p.catch === 'function') p.catch(() => setPseudoFull(true));
                    return;
                } catch (e) { /* on passe au repli */ }
            }
            setPseudoFull(true); // iPhone : pas de plein écran pour un élément -> on couvre toute la fenêtre
        }

        function exitFull() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (exit) exit.call(document);
            }
            setPseudoFull(false);
        }

        // Taille normale : 1 clic sur l'image = retour au début.
        // Plein écran : 1 clic = retour à la taille normale (sans remise à zéro).
        stage.addEventListener('click', (e) => {
            if (!running) return;                                             // pas pendant le chargement
            if (e.target.closest && e.target.closest('#simu-start')) return;  // clic sur l'écran de lancement
            if (isFull()) exitFull();
            else resetVideo();
        });
        $('full').addEventListener('click', enterFull); // lien "plein écran" au-dessus de la vidéo
        stage.addEventListener('contextmenu', (e) => e.preventDefault());

        function onKeydown(e) {
            if (!root.isConnected) { document.removeEventListener('keydown', onKeydown); return; }
            if (e.key === 'Escape' && stage.classList.contains('pseudoFull')) setPseudoFull(false);
        }
        document.addEventListener('keydown', onKeydown);

        // ---------------------------------------------------------------- écouteurs
        slider.addEventListener('input', () => {
            const v = Number(slider.value);
            if (v !== lastSlider) { lastDir = v > lastSlider ? 1 : -1; lastSlider = v; }
            interacted = true;
            applySpeed();
        });
        videos.forEach(v => v.addEventListener('contextmenu', (e) => e.preventDefault()));
        $('load').addEventListener('click', start);

        // Onglet masqué : pause ; au retour : la lecture reprend
        function onVisibility() {
            if (!root.isConnected) { document.removeEventListener('visibilitychange', onVisibility); return; }
            if (document.hidden) videos.forEach(v => v.pause());
            else if (autoPending) { autoPending = false; start(); }
            else if (running) activeVideo().play().catch(() => { });
        }
        document.addEventListener('visibilitychange', onVisibility);

        // Page quittée : on arrête tout, on coupe les téléchargements et on se désabonne
        const guard = setInterval(() => {
            if (root.isConnected) return;
            clearInterval(guard);
            clearTimeout(debounceTimer);
            clearTimeout(settleTimer);
            clearTimeout(idleTimer);
            token++;
            running = false;
            document.removeEventListener('visibilitychange', onVisibility);
            document.removeEventListener('keydown', onKeydown);
            document.body.classList.remove('simu-pseudo-full');
            videos.forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
        }, 1000);

        updateDisplay(currentSpeed());

        if (AUTO_START && !connectionIsLimited()) {
            $('start').hidden = true;          // pas de bouton : la vidéo démarre toute seule
            if (document.hidden) autoPending = true; // onglet ouvert en arrière-plan : on attend qu'il s'affiche
            else start();
        }
    })();
</script>
