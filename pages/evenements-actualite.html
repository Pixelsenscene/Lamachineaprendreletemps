<!-- === 3. LE SCRIPT (JAVASCRIPT) === -->
<script>
    // Enveloppé dans une fonction : rien ne fuit dans l'espace global,
    // donc aucun conflit quand la sous-page est rechargée.
    (function () {
        const video = document.getElementById("actu-video");
        const videoSection = document.getElementById("video-section");
        const closeBtn = document.getElementById("close-video-btn");
        const reopenWrapper = document.getElementById("reopen-link-wrapper");
        const reopenBtn = document.getElementById("reopen-video-btn");

        // Lecture "sûre" : le navigateur peut refuser (ex : son non coupé sur Safari)
        function safePlay() {
            if (!video) return;
            const p = video.play();
            if (p && typeof p.catch === "function") p.catch(() => { });
        }

        function hideVideoShowLink() {
            if (video) video.pause();
            if (videoSection) videoSection.classList.add("video-hidden");
            if (reopenWrapper) {
                reopenWrapper.classList.remove("reopen-hidden");
                reopenWrapper.classList.add("reopen-visible");
            }
        }

        function showVideoAndPlay(e) {
            if (e) e.preventDefault();
            if (reopenWrapper) {
                reopenWrapper.classList.remove("reopen-visible");
                reopenWrapper.classList.add("reopen-hidden");
            }
            if (videoSection) videoSection.classList.remove("video-hidden");
            if (video) {
                video.currentTime = 0;
                safePlay();
            }
        }

        if (video) video.addEventListener("ended", hideVideoShowLink);
        if (closeBtn) closeBtn.addEventListener("click", hideVideoShowLink);
        if (reopenBtn) reopenBtn.addEventListener("click", showVideoAndPlay);
    })();
</script>
