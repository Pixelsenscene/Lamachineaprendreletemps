<!-- Script pour caler le début à 0s lors du clic sur Play -->
<script>
    document.querySelectorAll('.gallery-video').forEach(video => {
        let hasStarted = false;
        video.addEventListener('play', function () {
            if (!hasStarted) {
                this.currentTime = 0;
                hasStarted = true;
            }
        });
    });
</script>
