<!-- === 3. LE SCRIPT (JAVASCRIPT) === -->
<script>
    (function () {
        // Nettoyage d'une éventuelle visite précédente d'une page à lecteur / carrousel agrandi
        if (window.__mpKeydown) document.removeEventListener('keydown', window.__mpKeydown);

        const layout = document.getElementById('th-layout');
        const overlay = document.getElementById('lb-overlay');
        const video = document.getElementById('th-video');
        const prevBtn = document.getElementById('th-prev');
        const nextBtn = document.getElementById('th-next');
        if (!layout || !overlay || !video) return;

        const items = Array.from(layout.querySelectorAll('.video-item'));
        if (items.length === 0) return;
        const wrappers = items.map(it => it.querySelector('.custom-video-wrapper'));

        // ================================================================ 1. FORMATS
        // Format (largeur / hauteur) de chaque vidéo : supposé portrait (9/16) tant qu'il n'est pas connu.
        const PORTRAIT = 9 / 16;
        const ratios = items.map(() => PORTRAIT);

        function setRatio(i, w, h) {
            if (!w || !h) return;
            ratios[i] = w / h;
            wrappers[i].style.aspectRatio = w + ' / ' + h;                    // cadre exactement au format
            items[i].style.setProperty('--grow', String(Math.round(ratios[i] * 1000))); // largeur proportionnelle au format
        }

        // 1) Normal : le format se lit sur l'IMAGE de vignette (quelques dizaines de Ko), sans toucher à la vidéo.
        function posterReady(i) {
            return new Promise(resolve => {
                const url = wrappers[i].dataset.poster;
                if (!url) return resolve(false); // pas d'image pour cette vidéo : repli sur la vidéo (aucune requête d'image)
                const img = new Image();
                img.className = 'poster';
                img.alt = '';
                img.decoding = 'async';
                img.onload = () => {
                    wrappers[i].insertBefore(img, wrappers[i].firstChild);
                    setRatio(i, img.naturalWidth, img.naturalHeight);
                    wrappers[i].classList.add('has-poster');
                    resolve(true);
                };
                img.onerror = () => resolve(false); // image introuvable : repli sur la vidéo
                img.src = url;
            });
        }

        // 2) Repli (image absente) : on lit le début de la vidéo, quelques-unes à la fois (métadonnées seulement).
        function probe(i) {
            return new Promise(resolve => {
                const v = document.createElement('video');
                let finished = false;
                const finish = () => {
                    if (finished) return;
                    finished = true;
                    v.removeAttribute('src');
                    v.load(); // coupe le téléchargement
                    resolve();
                };
                v.preload = 'metadata';
                v.muted = true;
                v.addEventListener('loadedmetadata', () => { setRatio(i, v.videoWidth, v.videoHeight); finish(); });
                v.addEventListener('error', finish);
                setTimeout(finish, 8000);
                v.src = wrappers[i].dataset.src;
            });
        }

        async function loadRatios() {
            const found = await Promise.all(items.map((_, i) => posterReady(i)));
            const missing = found.map((ok, i) => ok ? -1 : i).filter(i => i >= 0);
            let next = 0;
            const workers = Array.from({ length: 4 }, async () => {
                while (next < missing.length) await probe(missing[next++]);
            });
            await Promise.all(workers);
        }

        // ================================================================ 2. RÉPARTITION EN LIGNES
        // Chaque ligne a la longueur du conteneur ; la hauteur d'une ligne de n vidéos vaut
        // (largeur - écarts) / somme des formats. On cherche, SANS changer l'ordre, le découpage en lignes
        // (4 vidéos maximum) dont les hauteurs sont les plus proches possible d'une hauteur idéale,
        // celle d'une ligne pleine de vidéos portrait.
        function partition(r, width, gap, max) {
            const n = r.length;
            const target = (width - (max - 1) * gap) / (max * PORTRAIT);
            const cost = new Array(n + 1).fill(Infinity);
            const from = new Array(n + 1).fill(0);
            cost[0] = 0;
            for (let j = 1; j <= n; j++) {
                for (let k = 1; k <= max && k <= j; k++) {
                    let sum = 0;
                    for (let t = j - k; t < j; t++) sum += r[t];
                    const h = (width - (k - 1) * gap) / sum;
                    const c = cost[j - k] + Math.pow(Math.log(h / target), 2);
                    if (c < cost[j]) { cost[j] = c; from[j] = j - k; }
                }
            }
            const rows = [];
            for (let j = n; j > 0; j = from[j]) rows.unshift(Array.from({ length: j - from[j] }, (_, q) => from[j] + q));
            return rows;
        }

        let lastKey = '';
        let lastWidth = 0;
        let thumbsStarted = false;

        function buildRows() {
            const width = layout.clientWidth;
            if (!width) return;
            lastWidth = width;
            const gap = parseFloat(getComputedStyle(layout).getPropertyValue('--gap')) || 20;
            const max = width >= 760 ? 4 : (width >= 480 ? 3 : 2); // 4 vidéos maximum par ligne (moins sur petit écran)
            const rows = partition(ratios, width, gap, max);

            const key = max + '|' + rows.map(r => r.join(',')).join(';');
            if (key !== lastKey) {
                lastKey = key;
                const frag = document.createDocumentFragment();
                rows.forEach(idx => {
                    const row = document.createElement('div');
                    row.className = 'video-row';
                    idx.forEach(i => row.appendChild(items[i]));
                    frag.appendChild(row);
                });
                layout.querySelectorAll('.video-row').forEach(r => r.remove());
                layout.appendChild(frag);
            }
            layout.classList.add('ready');
            startVideoThumbs(); // seulement une fois les lignes en place (avant, tous les cadres sont empilés dans un petit espace)
        }

        // On calcule la répartition dès que tous les formats sont connus (ou au bout de 4 s au plus : les formats
        // qui arrivent ensuite ajustent seulement les largeurs, les lignes restent pleines et de même hauteur).
        Promise.race([loadRatios(), new Promise(r => setTimeout(r, 4000))]).then(buildRows);

        // Largeur de la page qui change (fenêtre, rotation) : nouvelle répartition si besoin
        let resizeTimer = null;
        function onResize() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (!layout.isConnected) return;
                if (Math.abs(layout.clientWidth - lastWidth) > 24) buildRows();
            }, 150);
        }
        window.addEventListener('resize', onResize);

        // ================================================================ 3. VIGNETTES VIDÉO (repli seulement)
        // Uniquement pour les vidéos SANS image de vignette. Chargement économe : le début d'une vignette n'est
        // téléchargé que lorsqu'elle approche de l'écran. Toutes les vidéos sont EN PAUSE à l'ouverture de la page.
        function loadThumb(w) {
            const v = w.querySelector('video');
            if (!v || v.dataset.loaded) return;
            v.dataset.loaded = '1';
            v.preload = 'metadata';
            v.src = w.dataset.src + '#t=0.1'; // #t=0.1 : la vignette est la 1ère image
        }

        wrappers.forEach((w, i) => {
            const v = w.querySelector('video');
            if (v) v.addEventListener('loadedmetadata', () => setRatio(i, v.videoWidth, v.videoHeight));
        });

        function startVideoThumbs() {
            if (thumbsStarted) return;
            thumbsStarted = true;
            const todo = wrappers.filter(w => !w.classList.contains('has-poster'));
            if (todo.length === 0) return;
            if ('IntersectionObserver' in window) {
                const io = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) { loadThumb(entry.target); io.unobserve(entry.target); }
                    });
                }, { rootMargin: '400px 0px' });
                todo.forEach(w => io.observe(w));
            } else {
                todo.forEach(loadThumb);
            }
        }

        // ================================================================ 4. CARROUSEL PLEIN ÉCRAN
        // Un clic sur une vignette ouvre le carrousel sur cette vidéo : lecture AUTOMATIQUE, avec le SON, en boucle.
        // Flèches ◀ ▶ de part et d'autre (ou touches ← →) pour changer de vidéo, la lecture repart seule.
        // Aucun bouton lecture / pause : un clic sur la vidéo (ou Échap) ferme le carrousel.
        // À la fermeture, la vidéo s'arrête : la page revient en pause.
        const titles = items.map(it => { const h3 = it.querySelector('h3'); return h3 ? h3.textContent.trim() : ''; });
        let current = -1;

        function show(index) {
            current = (index + items.length) % items.length; // boucle : après la dernière, la première
            video.setAttribute('aria-label', titles[current]);
            // image de la vignette affichée pendant le démarrage de la vidéo (s'il y en a une)
            if (wrappers[current].classList.contains('has-poster')) video.poster = wrappers[current].dataset.poster;
            else video.removeAttribute('poster');
            video.muted = false;
            video.src = wrappers[current].dataset.src;
            const p = video.play();
            if (p && typeof p.catch === 'function') {
                p.catch(() => { // lecture avec son refusée par le navigateur : on lit au moins l'image
                    video.muted = true;
                    video.play().catch(() => { });
                });
            }
        }

        function openStage(index) {
            overlay.classList.add('open');
            overlay.setAttribute('aria-hidden', 'false');
            show(index);
        }

        function closeStage() {
            const last = wrappers[current];
            video.pause();
            video.removeAttribute('src'); // coupe aussi le téléchargement en cours
            video.load();
            overlay.classList.remove('open');
            overlay.setAttribute('aria-hidden', 'true');
            current = -1;
            if (last) last.focus({ preventScroll: true });
        }

        wrappers.forEach((w, i) => {
            w.addEventListener('click', () => openStage(i));
            w.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openStage(i); }
            });
        });

        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); show(current - 1); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); show(current + 1); });

        // Un clic sur la vidéo (ou sur le fond sombre autour) ferme le carrousel
        overlay.addEventListener('click', (e) => {
            if (e.target.closest('.carousel-btn')) return;
            closeStage();
        });

        // La page derrière ne défile pas tant que le carrousel est ouvert
        overlay.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
        overlay.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        // Clavier : Échap ferme ; ← → changent de vidéo
        function onKeydown(e) {
            if (!overlay.isConnected) { // page quittée : on se désabonne
                document.removeEventListener('keydown', onKeydown);
                window.removeEventListener('resize', onResize);
                return;
            }
            if (!overlay.classList.contains('open')) return;

            if (e.key === 'Escape') {
                closeStage();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                show(current + (e.key === 'ArrowLeft' ? -1 : 1));
            }
        }
        window.__mpKeydown = onKeydown;
        document.addEventListener('keydown', onKeydown);
    })();
</script>
