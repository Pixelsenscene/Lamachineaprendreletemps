<!-- === 3. LE SCRIPT (JAVASCRIPT) === -->
<script>
    // Suivi de l'index actif pour chacun des 3 carrousels
    const carouselIndices = { 1: 0, 2: 0, 3: 0 };

    // Démarrage forcé de la 1ère vidéo de chaque carrousel au chargement
    (function initFirstVideos() {
        setTimeout(() => {
            [1, 2, 3].forEach(id => {
                const track = document.getElementById(`vrCarouselTrack${id}`);
                if (track) {
                    const firstVid = track.querySelector('.carousel-slide:first-child video');
                    if (firstVid) {
                        firstVid.play().catch(e => console.log("Autoplay initial bloqué par le navigateur :", e));
                    }
                }
            });
        }, 100);
    })();

    // Gestion du clic pour basculer en plein écran
    function handleCarouselVideoClick(video, event) {
        event.stopPropagation();
        const container = video.closest('.vr-carousel-container');

        if (container) {
            if (!container.classList.contains('fullscreen-mode')) {
                container.classList.add('fullscreen-mode');
                video.play();
            } else {
                container.classList.remove('fullscreen-mode');
            }
        }
    }

    // Déplacement dans un carrousel spécifique
    function moveCarousel(carouselId, direction, event) {
        if (event) event.stopPropagation();

        const track = document.getElementById(`vrCarouselTrack${carouselId}`);
        if (!track) return;

        const slides = track.querySelectorAll('.carousel-slide');

        // Mettre en pause toutes les vidéos du carrousel pendant la transition
        slides.forEach(slide => {
            const v = slide.querySelector('video');
            if (v) v.pause();
        });

        carouselIndices[carouselId] += direction;

        if (carouselIndices[carouselId] < 0) {
            carouselIndices[carouselId] = slides.length - 1;
        } else if (carouselIndices[carouselId] >= slides.length) {
            carouselIndices[carouselId] = 0;
        }

        const activeIndex = carouselIndices[carouselId];
        track.style.transform = `translateX(-${activeIndex * 100}%)`;

        // Lecture automatique de la vidéo affichée
        const activeVideo = slides[activeIndex].querySelector('video');
        if (activeVideo) {
            activeVideo.play().catch(e => console.log("Lecture bloquée :", e));
        }
    }
</script>
