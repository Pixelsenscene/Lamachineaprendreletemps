<!-- === 1. LE CONTENU === -->
<section class="galeries-section-wrapper">

    <!-- Barre de sous-menus fixe (jamais de fondu ni de mouvement).
         L'état "active" des boutons est géré par loadSubPage() dans script.js. -->
    <nav class="sub-nav-buttons">
        <button type="button" class="sub-btn" data-subpage="galerie-courtes-realisations"
            onclick="loadSubPage('galerie-courtes-realisations')">Courtes réalisations</button>
        <button type="button" class="sub-btn" data-subpage="galerie-par-thematiques"
            onclick="loadSubPage('galerie-par-thematiques')">Par thématiques</button>
        <button type="button" class="sub-btn" data-subpage="galerie-premieres-machines"
            onclick="loadSubPage('galerie-premieres-machines')">Les 1ères Machines</button>
        <button type="button" class="sub-btn" data-subpage="galerie-ralentis"
            onclick="loadSubPage('galerie-ralentis')">Ralentis</button>
    </nav>

    <!-- Conteneur de la sous-page (lui subit le fondu au noir de 200ms) -->
    <div id="sub-page-content" class="sub-page-content"></div>

</section>


<!-- === 2. LE STYLE === -->
<!-- Le CSS du conteneur et de la barre de sous-menus est dans style.css -->


<!-- === 3. LE SCRIPT === -->
<script>
    // Au chargement de la page Galeries : sous-page demandée par le menu / l'URL
    // (window.pendingSubPage), sinon "Courtes réalisations" par défaut.
    loadSubPage(window.pendingSubPage || 'galerie-par-thematiques');
    window.pendingSubPage = ''; // Reset
</script>
