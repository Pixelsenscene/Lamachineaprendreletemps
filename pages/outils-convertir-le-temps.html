<!-- === 1. LE CONTENU === -->
<!-- Outil repris de l'appli Python "AppliRalentir" (page "Convertir le temps") -->
<section class="tool-convertir" id="tool-convertir">

    <h2 class="titreConvertir">Convertir le temps</h2>

    <!-- Ligne 1 : Heures / Minutes / Secondes (chaque champ est cerclé de bleu clair) -->
    <div class="zoneMain">
        <div class="tf">
            <label for="cv-hr">Heures</label>
            <input id="cv-hr" type="number" min="0" step="any">
        </div>
        <div class="tf">
            <label for="cv-min">Minutes</label>
            <input id="cv-min" type="number" min="0" step="any">
        </div>
        <div class="tf">
            <label for="cv-sec">Secondes</label>
            <input id="cv-sec" type="number" min="0" step="any">
        </div>
    </div>

    <!-- Ligne 2 : Jours / Mois / Années / Siècles, sans encadré et plus discrets -->
    <div class="zoneMinor">
        <div class="minorRow">
            <div class="tf">
                <label class="gris" for="cv-day">Jours</label>
                <input id="cv-day" type="number" min="0" step="any" class="gris">
            </div>
            <div class="tf">
                <label class="gris" for="cv-month">Mois</label>
                <input id="cv-month" type="number" min="0" step="any" class="gris">
            </div>
            <div class="tf">
                <label class="gris" for="cv-year">Années</label>
                <input id="cv-year" type="number" min="0" step="any" class="gris">
            </div>
            <div class="tf">
                <label class="gris" for="cv-century">Siècles</label>
                <input id="cv-century" type="number" min="0" step="any" class="gris">
            </div>
        </div>
    </div>

    <div class="actions">
        <button type="button" id="cv-btnCalculer" disabled>Calculer</button>
        <!-- "supprimer" : n'apparaît que lorsqu'un champ est rempli ou qu'un calcul est en place (il peut être seul) -->
        <button type="button" id="cv-btnClear" hidden title="Tout supprimer et recommencer">supprimer</button>
    </div>

    <div class="resultLine">
        <span class="egal">=</span>
        <!-- Bloc central : par défaut une simple zone de RÉSULTAT (texte). Un clic sur le bloc fait apparaître les champs
             h / min / sec (saisie, flèches haut/bas, roulette) ; les champs du dessus s'adaptent alors
             "comme on compte le temps" (60 s, 60 min, 24 h, 30 j par mois, 12 mois...). -->
        <div id="cv-resultDefault" class="result">
            <div class="resText" id="cv-resultText" role="button" tabindex="0"
                aria-label="Résultat : cliquer pour le modifier"></div>
            <div class="resRow">
                <span class="resField"><input id="cv-rh" type="number" step="any" placeholder="0"
                        aria-label="Heures du résultat"><span class="resUnit">h</span></span>
                <span class="resField"><input id="cv-rm" type="number" step="any" placeholder="0"
                        aria-label="Minutes du résultat"><span class="resUnit">min</span></span>
                <span class="resField"><input id="cv-rs" type="number" step="any" placeholder="0"
                        aria-label="Secondes du résultat"><span class="resUnit">sec</span></span>
            </div>
        </div>
    </div>

    <!-- Partie du bas (de "Résultat selon l'unité" jusqu'au résultat "soit :") : cadre gris en pointillés -->
    <div class="unitZone">
        <h3>Résultat selon l’unité</h3>
        <div class="unitButtons">
            <div class="unitRow">
                <button type="button" data-unit="sec">Secondes</button>
                <button type="button" data-unit="min">Minutes</button>
                <button type="button" data-unit="hr">Heures</button>
            </div>
            <div class="unitRow">
                <button type="button" data-unit="day">Jours</button>
                <button type="button" data-unit="month">Mois</button>
                <button type="button" data-unit="year">Années</button>
                <button type="button" data-unit="century">Siècles</button>
            </div>
        </div>

        <div class="result2cols">
            <div id="cv-resultUnitLeft" class="result"></div>
        </div>
    </div>

    <!-- Résultat "soit :" : en dessous du cadre en pointillés, en gris -->
    <div class="soitLine">
        <div id="cv-resultUnitRightBox" class="result">
            <span id="cv-resultUnitRight" class="resVal"></span>
            <!-- "soit :" est DANS le bloc, aligné à gauche (n'est affiché que si le bloc contient un résultat) -->
            <span class="soit">soit :</span>
        </div>
    </div>

</section>

<!-- === 3. LE SCRIPT (JAVASCRIPT) === -->
<script>
    // Enveloppé dans une fonction : aucune variable globale (l'appli d'origine en créait),
    // et tous les écouteurs sont limités à l'outil (le "Entrée" ne se déclenche plus sur tout le site).
    (function () {
        const root = document.getElementById('tool-convertir');
        if (!root) return;

        const FIELDS = ['hr', 'min', 'sec', 'day', 'month', 'year', 'century']; // ordre d'affichage
        const CENTRAL = ['rh', 'rm', 'rs']; // champs du bloc central : heures, minutes, secondes
        const ORDER = ['century', 'year', 'month', 'day', 'hr', 'min', 'sec'];
        // Valeur de chaque unité en secondes (mois = 30 jours, année = 365 jours)
        const UNITS = {
            century: 100 * 365 * 86400,
            year: 365 * 86400,
            month: 30 * 86400,
            day: 86400,
            hr: 3600,
            min: 60,
            sec: 1
        };

        const el = (id) => document.getElementById('cv-' + id);

        // Noms français des unités pour le résultat de gauche (singulier, pluriel)
        const UNIT_NAMES = {
            sec: ['seconde', 'secondes'],
            min: ['minute', 'minutes'],
            hr: ['heure', 'heures'],
            day: ['jour', 'jours'],
            month: ['mois', 'mois'],
            year: ['an', 'ans'],
            century: ['siècle', 'siècles']
        };

        // ---------------------------------------------------------------- roulette de la souris
        // Dans un champ sélectionné (cliqué), la molette remplace les flèches haut / bas :
        //   défiler vers le HAUT = flèche haut (+1)  ;  défiler vers le BAS = flèche bas (-1).
        // Plus le défilement est rapide et fort, plus les chiffres défilent vite.
        const WHEEL_NEEDS_FOCUS = true; // true : le champ doit avoir été cliqué (la page défile normalement sinon)
        const PX_PER_UNIT = 100;        // un cran de molette de souris (~100 px) = 1 unité à vitesse normale
        const FAST_FROM = 800;          // au-delà de cette vitesse de défilement (px/s), les chiffres accélèrent
        const FAST_RANGE = 1200;        // plus cette valeur est petite, plus l'accélération est brutale
        const MAX_FACTOR = 12;          // accélération maximale (×12)

        function wheelPixels(e) {
            let d = e.deltaY;
            if (e.deltaMode === 1) d *= 33;       // "lignes" (Firefox avec une souris) -> pixels
            else if (e.deltaMode === 2) d *= 400; // "pages"
            return d;
        }

        function enableWheel(field, afterStep) {
            let acc = 0;   // fraction d'unité en attente
            let vel = 0;   // vitesse de défilement lissée (px/s)
            let last = 0;

            field.addEventListener('wheel', (e) => {
                if (WHEEL_NEEDS_FOCUS && document.activeElement !== field) return;

                const d = wheelPixels(e);
                if (!d) return;
                e.preventDefault();

                const now = performance.now();
                const dt = Math.max(now - last, 8);
                vel = dt > 300 ? 0 : 0.5 * vel + 0.5 * (Math.abs(d) / dt * 1000); // nouvelle séquence si pause
                last = now;

                const factor = Math.min(MAX_FACTOR, 1 + Math.max(0, vel - FAST_FROM) / FAST_RANGE);
                const sign = d < 0 ? 1 : -1; // vers le haut = augmente

                if (acc !== 0 && Math.sign(acc) !== sign) acc = 0; // changement de sens : on repart de zéro

                // Un vrai "cran" de molette (≥ 40 px : 100 sur Mac/Chrome, 120 sur Windows, ~99 sur Firefox) vaut
                // toujours au moins 1 unité ; les petits défilements du pavé tactile s'accumulent en fractions.
                const abs = Math.abs(d);
                const base = abs >= 40 ? Math.max(1, Math.round(abs / PX_PER_UNIT)) : abs / PX_PER_UNIT;
                acc += sign * base * factor;

                const steps = Math.trunc(acc);
                if (steps === 0) return;
                acc -= steps;

                const min = field.min !== '' ? Number(field.min) : -Infinity;
                const next = Math.max(min, (Number(field.value) || 0) + steps);
                field.value = String(+next.toFixed(10)); // évite 0.30000000000000004
                field.dispatchEvent(new Event('input', { bubbles: true })); // comme une saisie au clavier
                if (typeof afterStep === 'function') afterStep(field);      // ex : report des retenues (59 s + 1 = 1 min)
            }, { passive: false });
        }

        let totalSeconds = null; // null tant qu'on n'a pas cliqué sur "Calculer"
        // true dès qu'un premier calcul est en place : "Calculer" disparaît, et toute modification des champs
        // recalcule instantanément. Repasse à false avec "supprimer".
        let calculated = false;
        let currentUnit = null;  // unité choisie dans "Résultat selon l'unité"

        // ---------------------------------------------------------------- bloc central (modifiable)
        const round2 = (n) => Math.round(n * 100) / 100; // évite 5.300000000000001

        // Écrit le temps dans le bloc central : heures (sans limite), minutes (< 60), secondes (< 60)
        function writeCentral(total) {
            const t = Math.max(0, round2(total));
            el('rh').value = String(Math.floor(t / 3600));
            el('rm').value = String(Math.floor((t % 3600) / 60));
            el('rs').value = String(round2(t % 60));
        }

        const centralBlank = () => CENTRAL.every(id => el(id).value === '');

        // Texte du résultat (affiché tant qu'on ne modifie pas le bloc) : "1 h, 1 min, 1 sec"
        function renderCentralText() {
            if (totalSeconds === null) { el('resultText').textContent = ''; return; }
            const t = Math.max(0, round2(totalSeconds));
            el('resultText').textContent =
                `${Math.floor(t / 3600)} h, ${Math.floor((t % 3600) / 60)} min, ${round2(t % 60)} sec`;
        }

        let centralEditing = false; // true : les champs h / min / sec sont affichés
        let centralDirty = false;   // true : le bloc central a été modifié par l'utilisateur

        // Un clic sur le bloc fait apparaître les champs
        function enterCentralEdit() {
            if (centralEditing) return;
            centralEditing = true;
            if (totalSeconds !== null) writeCentral(totalSeconds); else CENTRAL.forEach(id => { el(id).value = ''; });
            el('resultDefault').classList.add('editing');
            el('rh').focus();
            if (el('rh').select) el('rh').select();
        }

        // On quitte l'édition : si le bloc a été modifié, on le remet "dans l'ordre", puis on réaffiche le texte
        function exitCentralEdit() {
            if (!centralEditing) return;
            if (centralDirty) commitCentral();
            centralEditing = false;
            el('resultDefault').classList.remove('editing');
            renderCentralText();
        }

        // Total en secondes d'après le bloc central (un champ vide compte pour 0 ; jamais négatif)
        function centralTotal() {
            const v = (id) => Number(el(id).value || 0);
            return Math.max(0, round2(v('rh') * 3600 + v('rm') * 60 + v('rs')));
        }

        // Décompose un temps comme on compte le temps : 60 s, 60 min, 24 h, 30 j par mois, 12 mois,
        // 365 j par an, 100 ans par siècle. Au-delà, c'est l'unité supérieure qui augmente.
        // (mois = 30 jours et année = 365 jours, comme dans tout l'outil)
        function writeTopFromTotal(total) {
            const whole = Math.floor(total);
            const fraction = total - whole;
            let rest = whole;
            const parts = {};
            ['century', 'year', 'month', 'day', 'hr', 'min'].forEach(u => {
                parts[u] = Math.floor(rest / UNITS[u]);
                rest -= parts[u] * UNITS[u];
            });
            parts.sec = round2(rest + fraction);

            // Les unités AU-DESSUS de la plus grande unité utilisée restent vides ;
            // celles en dessous affichent leur valeur, même 0 (ex : 5 min 0 s)
            let started = false;
            ORDER.forEach(u => {
                if (parts[u] > 0) started = true;
                el(u).value = started ? String(parts[u]) : '';
            });
        }

        // Le bloc central est modifié (clavier, flèches ou roulette) : les champs du dessus s'adaptent
        // et la conversion en dessous (selon l'unité choisie) se met à jour immédiatement.
        function onCentralInput() {
            if (centralBlank()) {
                FIELDS.forEach(id => { el(id).value = ''; });
                totalSeconds = null;
            } else {
                totalSeconds = centralTotal();
                writeTopFromTotal(totalSeconds);
                calculated = true; // un résultat est affiché : "Calculer" n'a plus lieu d'être
            }
            updateUnitResult();
            updateButtonState();
            renderCentralText();
        }

        // Validation (Entrée, changement de champ, pas de roulette ou de flèche) : le bloc central se remet
        // lui-même "dans l'ordre" (ex : 90 min -> 1 h 30 min ; 59 s + 1 -> 1 min 0 s ; 0 s - 1 -> minute précédente)
        function commitCentral() {
            if (centralBlank()) return;
            writeCentral(centralTotal());
            onCentralInput();
            centralDirty = false;
        }

        // Total en secondes d'après les champs du haut (un champ vide compte pour 0)
        function topTotal() {
            const val = (id) => Number(el(id).value || 0);
            return val('sec') +
                val('min') * 60 +
                val('hr') * 3600 +
                val('day') * 86400 +
                val('month') * UNITS.month +
                val('year') * UNITS.year +
                val('century') * UNITS.century;
        }

        // Un calcul est en place : on met à jour le bloc central et les résultats par unité
        function refreshResults() {
            totalSeconds = topTotal();
            writeCentral(totalSeconds);
            centralDirty = false;
            if (centralEditing) { centralEditing = false; el('resultDefault').classList.remove('editing'); }
            renderCentralText();
            updateUnitResult();
        }

        // Modification d'un champ du haut (clavier, flèches, roulette)
        function onTopInput() {
            if (calculated) {
                // calcul déjà en place : tout se met à jour instantanément, sans rappuyer sur Calculer
                if (FIELDS.some(id => el(id).value !== '')) {
                    refreshResults();
                } else {
                    totalSeconds = null; // tous les champs vidés : résultats vides
                    CENTRAL.forEach(id => { el(id).value = ''; });
                    renderCentralText();
                    updateUnitResult();
                }
            }
            updateButtonState();
        }

        // Bouton "Calculer" : premier calcul seulement. Ensuite tout est instantané.
        function convertTime() {
            if (!FIELDS.some(id => el(id).value !== '')) return; // rien à calculer (aussi pour la touche Entrée)
            const firstTime = !calculated;
            calculated = true;
            refreshResults();
            updateButtonState();

            if (!firstTime) return; // plus de défilement automatique une fois le calcul en place

            // Défilement vers les résultats
            root.querySelector('.result2cols').scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        }

        function setUnit(unit) {
            currentUnit = unit;

            root.querySelectorAll('.unitButtons button').forEach(btn => {
                btn.classList.toggle('activeUnit', btn.dataset.unit === unit);
            });

            updateUnitResult();
        }

        // Décompose les secondes à partir de l'unité choisie (ex : 2 j 3 h 4 min)
        function decomposeRelative(seconds, unit) {
            let s = seconds;
            const relevantUnits = ORDER.slice(ORDER.indexOf(unit));
            const parts = [];

            for (const u of relevantUnits) {
                const value = Math.floor(s / UNITS[u]);
                s %= UNITS[u];

                if (value > 0) {
                    let label = '';
                    switch (u) {
                        case 'century': label = value + ' siècle' + (value > 1 ? 's' : ''); break;
                        case 'year': label = value + ' an' + (value > 1 ? 's' : ''); break;
                        case 'month': label = value + ' mois'; break;
                        case 'day': label = value + ' j'; break;
                        case 'hr': label = value + ' h'; break;
                        case 'min': label = value + ' min'; break;
                        case 'sec': label = value + ' s'; break;
                    }
                    parts.push(label);
                }
            }

            return parts.join(' ');
        }

        function updateUnitResult() {
            // Rien à afficher tant qu'il n'y a ni calcul ni unité choisie
            // (l'appli d'origine affichait alors "0.00 undefined")
            if (totalSeconds === null || !currentUnit) {
                el('resultUnitLeft').innerText = '';
                el('resultUnitRight').innerText = '';
                return;
            }

            const result = totalSeconds / UNITS[currentUnit];

            // Case de gauche : résultat dans l'unité choisie, en français, avec UN chiffre après la virgule
            // (ex : "1,0 heure", "61,0 minutes"). Le pluriel suit la valeur affichée.
            const [singular, plural] = UNIT_NAMES[currentUnit];
            const rounded = Math.round(result * 10) / 10;
            const number = rounded.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
            el('resultUnitLeft').innerText = `${number} ${Math.abs(rounded) >= 2 ? plural : singular}`;

            // Case de droite : décomposition
            el('resultUnitRight').innerText = decomposeRelative(totalSeconds, currentUnit);
        }

        // Boutons :
        //  • ouverture / après "supprimer" : "Calculer" seul, non cliquable ;
        //  • au moins un champ rempli, pas encore de calcul : "Calculer" (vert, cliquable) + "supprimer" ;
        //  • calcul en place : "Calculer" disparaît, "supprimer" reste seul.
        function updateButtonState() {
            const filled = FIELDS.some(id => el(id).value !== '');
            const calcBtn = el('btnCalculer');
            calcBtn.hidden = calculated;
            calcBtn.classList.toggle('ready', filled);
            calcBtn.disabled = !filled; // pas de clic possible tant qu'il n'est pas vert
            el('btnClear').hidden = !(filled || calculated || totalSeconds !== null);
        }

        function clearAll() {
            FIELDS.forEach(id => { el(id).value = ''; });
            CENTRAL.forEach(id => { el(id).value = ''; });
            centralDirty = false;
            centralEditing = false;
            el('resultDefault').classList.remove('editing');
            totalSeconds = null; // sinon un clic sur une unité réaffichait l'ancien résultat
            calculated = false;  // nouveau départ : "Calculer" réapparaît (seul, non cliquable)
            renderCentralText();
            updateUnitResult();
            updateButtonState();

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- Écouteurs ---
        FIELDS.forEach(id => {
            el(id).addEventListener('input', onTopInput);
            enableWheel(el(id));
        });

        el('btnCalculer').addEventListener('click', convertTime);
        el('btnClear').addEventListener('click', clearAll);

        root.querySelectorAll('.unitButtons button').forEach(btn => {
            btn.addEventListener('click', () => setUnit(btn.dataset.unit));
        });

        // Bloc central : saisie au clavier, flèches du champ, roulette
        CENTRAL.forEach(id => {
            el(id).addEventListener('input', () => { centralDirty = true; onCentralInput(); });
            el(id).addEventListener('change', commitCentral);
            enableWheel(el(id), commitCentral);
        });

        // Un clic sur le bloc (hors des champs) active la modification ; en cliquant ailleurs, on la quitte
        const centralBlock = el('resultDefault');
        centralBlock.addEventListener('mousedown', (e) => {
            // pendant l'édition, un clic sur le fond du bloc ne doit pas faire perdre le focus aux champs
            if (centralEditing && !e.target.closest('input')) e.preventDefault();
        });
        centralBlock.addEventListener('click', (e) => {
            if (!e.target.closest('input')) enterCentralEdit();
        });
        el('resultText').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterCentralEdit(); }
        });
        centralBlock.addEventListener('focusout', (e) => {
            if (!centralBlock.contains(e.relatedTarget)) exitCentralEdit(); // le focus sort du bloc
        });

        root.addEventListener('keydown', (e) => {
            // Entrée dans un champ du haut = lancer le calcul ; dans le bloc central = valider (remise en ordre)
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                if (CENTRAL.includes((e.target.id || '').replace('cv-', ''))) {
                    centralDirty = true; // la validation remet toujours le bloc dans l'ordre
                    exitCentralEdit();
                } else {
                    convertTime();
                }
                return;
            }

            // Cmd (ou Ctrl) + flèches = passer d'un champ à l'autre
            if (!(e.metaKey || e.ctrlKey)) return;

            const index = FIELDS.indexOf((document.activeElement.id || '').replace('cv-', ''));
            if (index === -1) return;

            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                const prev = FIELDS[index - 1];
                if (prev) { e.preventDefault(); el(prev).focus(); }
            } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                const next = FIELDS[index + 1];
                if (next) { e.preventDefault(); el(next).focus(); }
            }
        });

        // État initial : "Calculer" seul (non cliquable), "supprimer" caché
        updateButtonState();
        renderCentralText();
    })();
</script>
